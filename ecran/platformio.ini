; Atelier NMT — l'ecran de l'atelier (Panda Touch, ESP32-S3)
;
; La dalle, le tactile et LVGL viennent du template BigTreeTech, que
; ecran-flash.ps1 clone a cote au moment de compiler. Il n'est pas recopie
; dans ce depot : il n'a pas de licence, et ce depot est public.

[platformio]
default_envs = ecran

[env:ecran]
platform = espressif32@6.12.0
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200

lib_deps =
  lvgl/lvgl@9.3.0
  tamctec/TAMC_GT911@1.0.2
  moononournation/GFX Library for Arduino@1.5.0
  bblanchon/ArduinoJson@^7.2.0
  https://github.com/tzapu/WiFiManager.git#v2.0.17

build_flags =
  -I include
  -DLV_CONF_INCLUDE_SIMPLE
  -DBOARD_HAS_PSRAM

board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
