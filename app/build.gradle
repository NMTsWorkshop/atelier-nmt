plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.nmt.atelier'
    compileSdk 35

    defaultConfig {
        applicationId "fr.nmt.atelier"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "1.6"
    }

    // L'interface web vit dans /web à la racine du projet et devient
    // directement le dossier assets de l'APK : rien à recopier à la main.
    sourceSets {
        main {
            assets.srcDirs += ['../web']
        }
    }

    // Clé de signature stable, fournie par les secrets du dépôt.
    // Sans elle, Android refuse d'installer une mise à jour par-dessus
    // une version signée autrement — c'est ce qui bloquait les màj.
    signingConfigs {
        atelier {
            def ks = System.getenv("KEYSTORE_FILE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("KEYSTORE_FILE")) {
                signingConfig signingConfigs.atelier
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // uniquement pour FileProvider, indispensable pour lancer l'installation d'un APK
    implementation 'androidx.core:core:1.13.1'
    // lecture de l'etat des imprimantes Bambu en MQTT local
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
}
