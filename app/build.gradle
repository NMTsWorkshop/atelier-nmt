plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.nmt.atelier'
    compileSdk 35

    defaultConfig {
        applicationId "fr.nmt.atelier"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    // L'interface web vit dans /web à la racine du projet et devient
    // directement le dossier assets de l'APK : rien à recopier à la main.
    sourceSets {
        main {
            assets.srcDirs += ['../web']
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // uniquement pour FileProvider, indispensable pour lancer l'installation d'un APK
    implementation 'androidx.core:core:1.13.1'
    // lecture de l'etat des imprimantes Bambu en MQTT local
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
}
