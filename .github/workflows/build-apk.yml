name: APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler l'APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renommer et relever la version
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/atelier-nmt.apk
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version compilée : $VERSION"

      - name: Déposer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: atelier-nmt-apk
          path: out/atelier-nmt.apk
          if-no-files-found: error

      # Publie l'APK en « release » : c'est ce que l'app interroge
      # pour se mettre à jour toute seule. Le nom porte le numéro de version.
      - name: Publier la release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: derniere-version
          name: Atelier NMT ${{ env.VERSION }}
          files: out/atelier-nmt.apk
          body: |
            Version ${{ env.VERSION }}, compilée automatiquement.
            Commit ${{ github.sha }}.
