name: APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurer la clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Secret KEYSTORE_B64 absent : la mise à jour sur téléphone sera impossible." >&2
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/atelier.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/atelier.jks" >> $GITHUB_ENV

      - name: Compiler l'APK
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Effacer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/atelier.jks"

      - name: Renommer et relever la version
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/atelier-nmt.apk
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version compilée : $VERSION"

      - name: Déposer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: atelier-nmt-apk
          path: out/atelier-nmt.apk
          if-no-files-found: error

      # Publie aussi l'APK en « release », ce qui donne un lien direct
      # téléchargeable depuis le téléphone sans dézipper quoi que ce soit.
      - name: Publier la release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: derniere-version
          name: Atelier NMT ${{ env.VERSION }}
          files: out/atelier-nmt.apk
          body: |
            Version ${{ env.VERSION }}, compilée automatiquement.
            Commit ${{ github.sha }}.
