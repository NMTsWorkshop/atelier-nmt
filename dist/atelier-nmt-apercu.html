<script>
/* ============================================================
   machines.js — parc machines, timers, changement de filament
   ============================================================ */

function renderMachines() {
  const running = DB.machines.filter(m => m.status === 'running').length;
  const done = DB.machines.filter(m => m.status === 'done').length;
  setTop('Machines',
    DB.machines.length
      ? running + ' en cours · ' + done + ' terminée' + (done > 1 ? 's' : '') + ' · ' + DB.machines.length + ' machine' + (DB.machines.length > 1 ? 's' : '')
      : 'Aucune machine pour l\'instant',
    (DB.machines.some(m => m.printer && m.printer.host)
      ? '<button class="tb-btn" id="poll-btn" onclick="pollPrinters()">' + iconSync() + '</button>' : '') +
    '<button class="tb-btn accent" onclick="editMachine()">' + iconPlus() + 'Machine</button>'
  );

  if (!DB.machines.length) {
    return emptyState(
      'Ton parc est vide',
      'Ajoute tes imprimantes une par une : nom, modèle, et le filament actuellement chargé.',
      'Ajouter une machine', 'editMachine()'
    );
  }

  const warn = nativeWarningBanner();

  return warn + '<div class="stack">' + DB.machines.map(machineCard).join('') + '</div>';
}

function machineCard(m) {
  const sp = spoolById(m.filamentId);
  const pr = profileById(m.profileId);
  const now = Date.now();
  let cls = 'card mach', clock = '', sub = '', actions = '';

  /* si la machine est branchée et qu'on a une relève fraîche,
     c'est elle qui parle — le timer manuel passe au second plan */
  const live = (m.printer && m.printer.host && Printers.fresh(m.id)) ? Printers.state(m.id) : null;

  if (live && live.state === 'printing') {
    cls += ' running';
    const pct = live.percent >= 0 ? live.percent : 0;
    const rest = fmtRemaining(live.remaining);
    clock = '<div class="clock">' + pct + ' %</div>' +
            '<div class="clock-sub">' +
              (rest ? 'reste ' + esc(rest) : 'en cours') +
              (live.remaining > 0 ? ' · fin vers ' + fmtClock(now + live.remaining * 60000) : '') +
            '</div>';
    actions =
      '<button class="btn sm ghost" onclick="pollPrinters()">Actualiser</button>' +
      '<button class="btn sm primary" onclick="finishJob(\'' + m.id + '\')">Terminer</button>';
    if (live.file) sub = '<div class="card-meta nowrap" style="margin-top:6px;color:var(--txt-2)">' + esc(live.file) + '</div>';
    return machineShell(m, cls, clock, sub, actions, sp, live);
  }

  if (live && (live.state === 'finished' || live.state === 'idle') && m.status !== 'idle') {
    cls += ' done';
    clock = '<div class="clock done">Terminé</div>' +
            '<div class="clock-sub">' + esc(live.file || '') + '</div>';
    actions =
      '<button class="btn sm primary" onclick="finishJob(\'' + m.id + '\')">Décharger</button>' +
      '<button class="btn sm ghost" onclick="pollPrinters()">Actualiser</button>';
    return machineShell(m, cls, clock, sub, actions, sp, live);
  }

  if (m.status === 'running' && m.timer) {
    const left = m.timer.endAt - now;
    cls += ' running';
    clock = '<div class="clock" id="clk-' + m.id + '">' + fmtDur(left) + '</div>' +
            '<div class="clock-sub">fin vers ' + fmtDayClock(m.timer.endAt) + '</div>';
    actions =
      '<button class="btn sm" onclick="addTime(\'' + m.id + '\',15)">+15 min</button>' +
      '<button class="btn sm" onclick="addTime(\'' + m.id + '\',60)">+1 h</button>' +
      '<button class="btn sm ghost" onclick="stopTimer(\'' + m.id + '\')">Arrêter</button>' +
      '<button class="btn sm primary" onclick="finishJob(\'' + m.id + '\')">Terminer</button>';
  } else if (m.status === 'done') {
    cls += ' done';
    clock = '<div class="clock done" id="clk-' + m.id + '">Terminé</div>' +
            '<div class="clock-sub">' + (m.timer ? 'à ' + fmtDayClock(m.timer.endAt) : '') + '</div>';
    actions =
      '<button class="btn sm primary" onclick="finishJob(\'' + m.id + '\')">Décharger</button>' +
      '<button class="btn sm" onclick="startTimer(\'' + m.id + '\')">Relancer</button>';
  } else if (m.status === 'paused') {
    cls += ' paused';
    clock = '<div class="clock">En pause</div>';
    actions =
      '<button class="btn sm primary" onclick="startTimer(\'' + m.id + '\')">Reprendre</button>' +
      '<button class="btn sm ghost" onclick="setStatus(\'' + m.id + '\',\'idle\')">Libérer</button>';
  } else {
    clock = '<div class="clock muted" style="font-size:22px">Libre</div>';
    actions =
      '<button class="btn sm primary" onclick="startTimer(\'' + m.id + '\')">Lancer une impression</button>' +
      '<button class="btn sm" onclick="setStatus(\'' + m.id + '\',\'paused\')">Pause</button>';
  }

  if (m.job && m.job.label && m.status !== 'idle') {
    sub = '<div class="card-meta nowrap" style="margin-top:6px;color:var(--txt-2)">' + esc(m.job.label) + '</div>';
  }

  return machineShell(m, cls, clock, sub, actions, sp, live);
}

/* enveloppe commune : en-tête, ligne filament, rangée d'actions */
function machineShell(m, cls, clock, sub, actions, sp, live) {
  const pr = profileById(m.profileId);
  const lvl = sp ? spoolLevel(sp) : null;
  const err = (m.printer && m.printer.host) ? Printers.error(m.id) : '';

  return '<div class="' + cls + '">' +
    '<div class="card-head tap" onclick="editMachine(\'' + m.id + '\')">' +
      '<div class="grow">' +
        '<div class="card-name">' + esc(m.name) +
          (live ? ' <span class="badge ok" style="vertical-align:middle">en direct</span>' : '') +
        '</div>' +
        '<div class="card-meta">' + esc(m.model || '—') + (pr ? ' · ' + esc(pr.name) : '') + '</div>' +
        sub +
      '</div>' +
      '<div style="text-align:right">' + clock + '</div>' +
    '</div>' +
    (err ? '<div class="card-meta" style="margin-top:8px;color:var(--warn)">Machine injoignable — ' + esc(err) + '</div>' : '') +
    amsLine(live) +
    '<div class="fil-line">' +
      (sp
        ? dot(sp.colorHex) + '<span class="grow nowrap">' + esc(spoolLabel(sp)) + '</span>' +
          badge(lvl.cls, lvl.label)
        : '<span class="grow muted">Aucun filament renseigné</span>') +
      '<button class="btn sm ghost" onclick="loadFilament(\'' + m.id + '\')">Changer</button>' +
    '</div>' +
    '<div class="row wrap" style="margin-top:12px">' + actions + '</div>' +
  '</div>';
}

/* ce que l'AMS rapporte, tel quel — la couleur vient de la machine */
function amsLine(live) {
  if (!live || !live.ams || !live.ams.length) return '';
  return '<div class="row wrap" style="gap:6px;margin-top:10px">' +
    live.ams.map(t =>
      '<span class="badge">' +
        (t.color ? '<span class="dot" style="background:' + esc(t.color) + '"></span>' : '') +
        esc(t.type) + '</span>'
    ).join('') + '</div>';
}

/* ---------- actions ---------- */

function setStatus(id, st) {
  const m = machineById(id);
  if (!m) return;
  if (st === 'idle' || st === 'paused') {
    Native.cancelTimer(m.id);
    m.timer = null;
  }
  m.status = st;
  save(); render();
}

function editMachine(id) {
  const m = id ? machineById(id) : null;
  const pc = (m && m.printer) ? m.printer : {};
  const pk = pc.kind || '';
  sheet(
    '<h2>' + (m ? 'Modifier la machine' : 'Nouvelle machine') + '</h2>' +
    '<div class="sub">Le filament chargé se change directement depuis la fiche machine.</div>' +
    '<label class="field"><span>Nom</span><input type="text" name="name" placeholder="K2 Plus" value="' + esc(m ? m.name : '') + '"></label>' +
    '<label class="field"><span>Modèle</span><input type="text" name="model" placeholder="Creality K2 Plus" value="' + esc(m ? m.model : '') + '"></label>' +
    '<label class="field"><span>Profil d\'impression par défaut</span>' +
      '<select name="profileId">' + selectOpts(DB.profiles, m ? m.profileId : '', p => p.name, p => p.id, 'Aucun') + '</select>' +
    '</label>' +

    '<div class="sec-title">Liaison réseau</div>' +
    '<div class="hint" style="margin-bottom:10px">Renseignée, l\'app lit l\'avancement directement sur la machine et te notifie à la vraie fin, sans timer à saisir.</div>' +
    '<label class="field"><span>Marque</span>' +
      '<div class="chips" data-chips="kind">' +
        '<button type="button" class="chip' + (pk === '' ? ' on' : '') + '" data-v="">Aucune</button>' +
        PRINTER_KINDS.map(k =>
          '<button type="button" class="chip' + (pk === k.v ? ' on' : '') + '" data-v="' + k.v + '">' + k.label + '</button>'
        ).join('') +
      '</div>' +
    '</label>' +
    '<label class="field"><span>Adresse IP</span>' +
      '<input type="text" name="host" inputmode="decimal" placeholder="192.168.1.42" value="' + esc(pc.host || '') + '">' +
    '</label>' +
    '<div id="bambu-fields" style="display:' + (pk === 'bambu' ? 'block' : 'none') + '">' +
      '<label class="field"><span>Numéro de série</span>' +
        '<input type="text" name="serial" autocapitalize="characters" placeholder="01P00A…" value="' + esc(pc.serial || '') + '">' +
      '</label>' +
      '<label class="field"><span>Code d\'accès LAN</span>' +
        '<input type="text" name="code" placeholder="8 caractères" value="' + esc(pc.code || '') + '">' +
        '<div class="hint">Écran de l\'imprimante : Réglages → Réseau.</div>' +
      '</label>' +
    '</div>' +
    '<button class="btn wide" style="margin-bottom:6px" data-x="probe">Tester la liaison</button>' +
    '<div id="probe-out" class="hint"></div>' +

    '<div class="sheet-actions">' +
      (m ? '<button class="btn danger" data-x="del">Supprimer</button>' : '') +
      '<button class="btn ghost" data-x="no">Annuler</button>' +
      '<button class="btn primary" data-x="ok">Enregistrer</button>' +
    '</div>',
    root => {
      const chips = bindChips(root);
      const bambu = $('#bambu-fields', root);
      $$('[data-chips=kind] .chip', root).forEach(c => c.addEventListener('click', () => {
        bambu.style.display = c.getAttribute('data-v') === 'bambu' ? 'block' : 'none';
      }));

      $('[data-x=probe]', root).onclick = () => {
        const out = $('#probe-out', root);
        const conf = buildPrinter(chips(), formValues(root));
        if (!conf) { out.textContent = 'Choisis une marque et renseigne l\'adresse IP.'; return; }
        out.textContent = 'Connexion…';
        Printers.probe(conf).then(r => {
          if (r && r.ok) {
            out.innerHTML = '<span style="color:var(--ok)">Liaison établie — ' +
              esc(r.state || '?') + (r.percent >= 0 ? ' · ' + r.percent + ' %' : '') +
              (r.file ? ' · ' + esc(r.file) : '') + '</span>';
          } else {
            out.innerHTML = '<span style="color:var(--bad)">Échec — ' + esc((r && r.error) || 'sans réponse') + '</span>';
          }
        }).catch(e => { out.innerHTML = '<span style="color:var(--bad)">Échec — ' + esc(e.message) + '</span>'; });
      };

      $('[data-x=no]', root).onclick = closeSheet;
      const del = $('[data-x=del]', root);
      if (del) del.onclick = () => {
        closeSheet();
        confirmSheet('Supprimer ' + m.name + ' ?', 'La machine disparaît du parc. Le stock n\'est pas touché.', 'Supprimer', () => {
          Native.cancelTimer(m.id);
          DB.machines = DB.machines.filter(x => x.id !== m.id);
          save(); Printers.push(); render(); toast('Machine supprimée');
        }, true);
      };
      $('[data-x=ok]', root).onclick = () => {
        const v = formValues(root);
        if (!v.name.trim()) { toast('Il faut un nom', 'bad'); return; }
        const printer = buildPrinter(chips(), v);
        if (m) {
          m.name = v.name.trim(); m.model = v.model.trim(); m.profileId = v.profileId;
          m.printer = printer;
        } else {
          DB.machines.push({
            id: uid(), name: v.name.trim(), model: v.model.trim(),
            profileId: v.profileId, filamentId: '', status: 'idle', timer: null,
            job: null, printer: printer
          });
        }
        save(); Printers.push(); closeSheet(); render(); toast('Enregistré', 'ok');
      };
    }
  );
}

function loadFilament(id) {
  const m = machineById(id);
  if (!m) return;
  const list = activeSpools().filter(s => spoolTotal(s) > 0);
  if (!list.length) {
    confirmSheet('Aucun filament en stock', 'Ajoute d\'abord une référence dans l\'onglet Stock.', 'Ajouter du filament', () => {
      go('stock'); editSpool();
    });
    return;
  }
  sheet(
    '<h2>Filament sur ' + esc(m.name) + '</h2>' +
    '<div class="sub">Ce que tu renseignes ici sert au calcul de stock quand l\'impression est terminée.</div>' +
    '<label class="field"><span>Bobine chargée</span>' + spoolSelect('filamentId', m.filamentId) + '</label>' +
    '<div class="sheet-actions">' +
      '<button class="btn ghost" data-x="no">Annuler</button>' +
      '<button class="btn primary" data-x="ok">Valider</button>' +
    '</div>',
    root => {
      $('[data-x=no]', root).onclick = closeSheet;
      $('[data-x=ok]', root).onclick = () => {
        m.filamentId = formValues(root).filamentId;
        save(); closeSheet(); render(); toast('Filament mis à jour', 'ok');
      };
    }
  );
}

/* ---------- timer ---------- */

function startTimer(id) {
  const m = machineById(id);
  if (!m) return;
  const sp = spoolById(m.filamentId);
  const openLines = pendingLines();

  sheet(
    '<h2>Lancer sur ' + esc(m.name) + '</h2>' +
    '<div class="sub">' + (sp ? 'Filament : ' + esc(spoolLabel(sp)) : 'Aucun filament renseigné sur cette machine.') + '</div>' +

    '<label class="field"><span>Durée</span>' +
      '<div class="chips" data-chips="preset">' +
        [30, 60, 120, 240, 480, 720].map(min =>
          '<button type="button" class="chip" data-v="' + min + '">' + (min < 60 ? min + ' min' : (min / 60) + ' h') + '</button>'
        ).join('') +
      '</div>' +
    '</label>' +

    '<div class="field-2">' +
      '<label class="field"><span>Heures</span><input type="number" name="h" inputmode="numeric" placeholder="0" min="0"></label>' +
      '<label class="field"><span>Minutes</span><input type="number" name="min" inputmode="numeric" placeholder="0" min="0"></label>' +
    '</div>' +

    '<label class="field"><span>Pièce en cours</span>' +
      '<input type="text" name="label" placeholder="Casque Mando — coque" value="' + esc(m.job ? m.job.label : '') + '">' +
    '</label>' +

    (openLines.length
      ? '<label class="field"><span>Rattacher à une commande</span>' +
          '<select name="lineRef">' +
          '<option value="">Aucune</option>' +
          openLines.map(x =>
            '<option value="' + x.ref + '">' + esc(x.order.name + ' · ' + x.line.title + (x.line.variant ? ' (' + x.line.variant + ')' : '')) + '</option>'
          ).join('') +
          '</select>' +
          '<div class="hint">Le poids et la matière de la ligne seront repris automatiquement.</div>' +
        '</label>'
      : '') +

    '<div class="sheet-actions">' +
      '<button class="btn ghost" data-x="no">Annuler</button>' +
      '<button class="btn primary" data-x="ok">Démarrer</button>' +
    '</div>',

    root => {
      const getChips = bindChips(root);
      $$('.chip', root).forEach(c => c.addEventListener('click', () => {
        const min = parseInt(c.getAttribute('data-v'), 10);
        $('[name=h]', root).value = Math.floor(min / 60) || '';
        $('[name=min]', root).value = min % 60 || '';
      }));
      $('[data-x=no]', root).onclick = closeSheet;
      $('[data-x=ok]', root).onclick = () => {
        const v = formValues(root);
        const mins = num(v.h) * 60 + num(v.min);
        if (mins <= 0) { toast('Indique une durée', 'bad'); return; }
        const endAt = Date.now() + mins * 60000;

        let job = { label: v.label.trim(), orderId: '', lineId: '', grams: 0 };
        if (v.lineRef) {
          const cut = v.lineRef.indexOf('::');
          const o = orderById(v.lineRef.slice(0, cut));
          const lid = v.lineRef.slice(cut + 2);
          const l = o && (o.lines || []).find(x => x.id === lid);
          if (l) {
            job.orderId = o.id; job.lineId = l.id; job.grams = l.grams || 0;
            if (!job.label) job.label = l.title + (l.variant ? ' — ' + l.variant : '');
            if (o.status === 'todo') o.status = 'printing';
          }
        }

        m.job = job;
        m.timer = { startedAt: Date.now(), endAt: endAt, dur: mins * 60000 };
        m.status = 'running';

        scheduleFor(m);
        save(); closeSheet(); render();
        toast('Fin prévue à ' + fmtClock(endAt), 'ok');
      };
    }
  );
}

function scheduleFor(m) {
  if (!m.timer) return;
  const title = m.name + ' — impression terminée';
  const text = (m.job && m.job.label) ? m.job.label : 'Le timer est arrivé à son terme.';
  Native.scheduleTimer(m.id, title, text, m.timer.endAt);
  const before = DB.settings.notifyBefore;
  if (before > 0) {
    const pre = m.timer.endAt - before * 60000;
    if (pre > Date.now() + 5000) {
      Native.scheduleTimer(m.id + '-pre', m.name + ' — bientôt fini', 'Fin dans ' + before + ' min · ' + text, pre);
    }
  }
}

function addTime(id, mins) {
  const m = machineById(id);
  if (!m || !m.timer) return;
  m.timer.endAt += mins * 60000;
  if (m.status === 'done') m.status = 'running';
  scheduleFor(m);
  save(); render();
  toast('+' + mins + ' min — fin à ' + fmtClock(m.timer.endAt));
}

function stopTimer(id) {
  const m = machineById(id);
  if (!m) return;
  Native.cancelTimer(m.id);
  Native.cancelTimer(m.id + '-pre');
  m.timer = null; m.status = 'idle'; m.job = null;
  save(); render(); toast('Timer arrêté');
}

/* fin d'impression : on décompte le filament et on solde la ligne de commande */
function finishJob(id) {
  const m = machineById(id);
  if (!m) return;
  const sp = spoolById(m.filamentId);
  const guess = (m.job && m.job.grams) ? m.job.grams : '';

  sheet(
    '<h2>Impression terminée</h2>' +
    '<div class="sub">' + esc(m.name) + (m.job && m.job.label ? ' · ' + esc(m.job.label) : '') + '</div>' +

    (sp
      ? '<label class="field"><span>Filament consommé</span>' +
          '<input type="number" name="grams" inputmode="numeric" placeholder="0" value="' + esc(guess) + '">' +
          '<div class="hint">Déduit de ' + esc(spoolLabel(sp)) + ' — il reste ' + fmtG(spoolTotal(sp)) + '. Laisse vide si tu ne veux rien déduire.</div>' +
        '</label>'
      : '<div class="warn-box">Aucun filament n\'est associé à cette machine, rien ne sera déduit du stock.</div><div class="sp"></div>'
    ) +

    (m.job && m.job.lineId
      ? '<label class="field row" style="gap:9px;align-items:center">' +
          '<input type="checkbox" name="lineDone" checked style="width:auto">' +
          '<span style="margin:0">Marquer la pièce comme faite dans la commande</span>' +
        '</label>'
      : '') +

    '<div class="sheet-actions">' +
      '<button class="btn ghost" data-x="no">Annuler</button>' +
      '<button class="btn primary" data-x="ok">Valider</button>' +
    '</div>',

    root => {
      $('[data-x=no]', root).onclick = closeSheet;
      $('[data-x=ok]', root).onclick = () => {
        const v = formValues(root);
        const g = num(v.grams);
        if (sp && g > 0) {
          const r = consumeSpool(sp, g);
          if (r.missing > 0) {
            toast('Il manquait ' + fmtG(r.missing) + ' de ' + spoolLabel(sp), 'bad');
          } else if (r.opened > 0) {
            toast(r.opened > 1 ? r.opened + ' bobines entamées' : 'Nouvelle bobine entamée');
          }
          if (spoolTotal(sp) <= 0) toast(spoolLabel(sp) + ' est épuisé', 'bad');
          else if (needsRestock(sp)) toast(spoolLabel(sp) + ' : à racheter', 'bad');
        }
        if (m.job && m.job.lineId && v.lineDone) {
          const o = orderById(m.job.orderId);
          const l = o && (o.lines || []).find(x => x.id === m.job.lineId);
          if (l) {
            l.done = true;
            if ((o.lines || []).every(x => x.done)) o.status = 'done';
          }
        }
        Native.cancelTimer(m.id);
        Native.cancelTimer(m.id + '-pre');
        m.timer = null; m.job = null; m.status = 'idle';
        save(); closeSheet(); render(); toast('Machine libérée', 'ok');
      };
    }
  );
}

/* lignes de commande encore à imprimer, pour le rattachement */
function pendingLines() {
  const out = [];
  DB.orders.forEach(o => {
    if (o.status === 'done' || o.status === 'shipped') return;
    (o.lines || []).forEach(l => {
      if (!l.done) out.push({ ref: o.id + '::' + l.id, order: o, line: l });
    });
  });
  return out;
}

/* ---------- bandeau d'avertissement natif ---------- */

function nativeWarningBanner() {
  if (!Native.ok()) return '';
  let out = '';
  if (!Native.notificationsOk()) {
    out += '<div class="warn-box" style="margin-bottom:12px">Les notifications sont bloquées : tu ne seras pas prévenu en fin d\'impression. ' +
      '<button class="btn sm" style="margin-top:8px" onclick="Native.askNotifications()">Autoriser</button></div>';
  }
  if (!Native.exactAlarmsOk()) {
    out += '<div class="warn-box" style="margin-bottom:12px">Android n\'autorise pas encore les alarmes précises pour cette app, les notifications risquent d\'être en retard. ' +
      '<button class="btn sm" style="margin-top:8px" onclick="Native.openExactAlarmSettings()">Régler</button></div>';
  }
  return out;
}

function iconPlus() { return '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>'; }
function iconGear() { return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M17.7 6.3l-1.4 1.4M7.7 16.3l-1.4 1.4"/></svg>'; }
function iconSync() { return '<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.5 6.2M3 12A9 9 0 0 1 18.5 5.8"/><path d="M3 4v5h5M21 20v-5h-5"/></svg>'; }


/* assemble la liaison réseau depuis les champs de la fiche */
function buildPrinter(chipVals, v) {
  const kind = (chipVals && chipVals.kind) || '';
  const host = (v.host || '').trim();
  if (!kind || !host) return null;
  const p = { kind: kind, host: host };
  if (kind === 'bambu') {
    p.serial = (v.serial || '').trim();
    p.code = (v.code || '').trim();
  }
  return p;
}

/* relève immédiate de toutes les machines branchées */
function pollPrinters() {
  const btn = $('#poll-btn');
  if (btn) btn.textContent = '…';
  Printers.sync()
    .then(() => { render(); toast('Machines relevées', 'ok'); })
    .catch(e => { render(); toast('Relève impossible : ' + e.message, 'bad'); });
}
</script>
<script>
/* ============================================================
   stock.js — références de filament, niveaux, besoins matière

   Une fiche = une référence (marque + matière + couleur), avec le
   nombre de bobines neuves d'un côté et la bobine entamée de l'autre.
   Enregistrer 10 kg de noir prend donc dix secondes, pas dix fiches.
   ============================================================ */

function renderStock() {
  const list = activeSpools();
  const total = list.reduce((t, s) => t + spoolTotal(s), 0);
  const spools = list.reduce((t, s) => t + spoolCount(s), 0);
  const restock = list.filter(needsRestock).length;

  setTop('Stock',
    list.length
      ? fmtG(total) + ' · ' + spools + ' bobine' + (spools > 1 ? 's' : '') +
        (restock ? ' · ' + restock + ' à racheter' : '')
      : 'Aucun filament enregistré',
    '<button class="tb-btn accent" onclick="editSpool()">' + iconPlus() + 'Filament</button>'
  );

  if (!list.length) {
    return emptyState(
      'Pas encore de filament',
      'Une fiche par référence : marque, matière, couleur, et le nombre de bobines que tu as en réserve.',
      'Ajouter du filament', 'editSpool()'
    );
  }

  let out = '';

  /* ---- ce que réclament les commandes en cours ---- */
  const needs = globalNeeds();
  if (needs.length) {
    out += '<div class="sec-title">Ce qu\'il faut pour les commandes</div><div class="card tight">';
    needs.forEach(n => {
      const have = stockFor(n.material, n.color);
      const ok = have >= n.grams;
      const tight = ok && have < n.grams * 1.25;
      out += '<div class="rowitem">' +
        dot(colorHexOf(n.color)) +
        '<div class="grow"><div class="t">' + esc(n.material) + (n.color ? ' · ' + esc(n.color) : '') + '</div>' +
        '<div class="s">' + fmtG(n.grams) + ' nécessaires · ' + fmtG(have) + ' en stock</div></div>' +
        badge(ok ? (tight ? 'warn' : 'ok') : 'bad', ok ? (tight ? 'Juste' : 'OK') : 'Manque ' + fmtG(n.grams - have)) +
        '</div>';
    });
    out += '</div>';
  }

  /* ---- références regroupées par matière ---- */
  const byMat = {};
  list.forEach(s => { (byMat[s.material] = byMat[s.material] || []).push(s); });

  Object.keys(byMat).sort().forEach(mat => {
    const refs = byMat[mat].sort((a, b) => spoolTotal(b) - spoolTotal(a));
    const t = refs.reduce((x, s) => x + spoolTotal(s), 0);
    out += '<div class="sec-title">' + esc(mat) + ' <span class="norm">— ' + fmtG(t) + '</span></div>';
    out += '<div class="stack">' + refs.map(spoolCard).join('') + '</div>';
  });

  const arch = DB.spools.filter(s => s.archived).length;
  if (arch) {
    out += '<div class="sec-title">Archives</div>' +
      '<button class="btn wide ghost" onclick="showArchived()">Voir les ' + arch +
      ' référence' + (arch > 1 ? 's' : '') + ' épuisée' + (arch > 1 ? 's' : '') + '</button>';
  }

  return out;
}

function spoolCard(s) {
  const lvl = spoolLevel(s);
  const used = DB.machines.filter(m => m.filamentId === s.id).map(m => m.name);
  const sealed = s.sealed || 0;
  const open = s.open || 0;

  /* ligne du bas : l'état réel de la réserve, en français d'atelier */
  let detail;
  if (open > 0 && sealed > 0) {
    detail = '~' + fmtG(open) + ' entamés + ' + sealed + ' neuve' + (sealed > 1 ? 's' : '');
  } else if (open > 0) {
    detail = '~' + fmtG(open) + ' sur la bobine entamée, aucune d\'avance';
  } else if (sealed > 0) {
    detail = sealed + ' bobine' + (sealed > 1 ? 's' : '') + ' neuve' + (sealed > 1 ? 's' : '') + ', aucune entamée';
  } else {
    detail = 'Plus rien en stock';
  }

  return '<div class="card tight">' +
    '<div class="card-head tap" onclick="editSpool(\'' + s.id + '\')">' +
      '<div class="row grow" style="gap:9px">' + dot(s.colorHex, true) +
        '<div class="grow">' +
          '<div class="card-name" style="font-size:15px">' + esc(s.color || 'Sans couleur') +
            (spoolCount(s) > 1 ? ' <span class="muted" style="font-weight:500">×' + spoolCount(s) + '</span>' : '') +
          '</div>' +
          '<div class="card-meta">' + esc(s.brand || 'Marque ?') + ' · ' + esc(s.material) +
            (used.length ? ' · sur ' + esc(used.join(', ')) : '') + '</div>' +
        '</div>' +
      '</div>' +
      '<div style="text-align:right">' +
        badge(lvl.cls, lvl.label) +
        '<div class="card-meta mono" style="margin-top:5px">' + fmtG(spoolTotal(s)) + '</div>' +
      '</div>' +
    '</div>' +
    gauge(lvl.pct, lvl.cls) +
    '<div class="spread" style="margin-top:9px">' +
      '<div class="small muted">' + esc(detail) + '</div>' +
      '<button class="btn sm ghost" onclick="quickLevel(\'' + s.id + '\')">Ajuster</button>' +
    '</div>' +
    (needsRestock(s) ? '<div class="fil-line"><span class="grow small" style="color:var(--bad)">À racheter</span></div>' : '') +
  '</div>';
}

/* ---------- ajustements rapides ---------- */

function quickLevel(id) {
  const s = spoolById(id);
  if (!s) return;
  const size = s.spoolSize || 1000;
  const steps = [
    { l: 'Pleine', r: 1 }, { l: '3/4', r: .75 }, { l: 'Moitié', r: .5 },
    { l: '1/4', r: .25 }, { l: 'Bientôt vide', r: .1 }, { l: 'Vide', r: 0 }
  ];

  sheet(
    '<h2>' + esc(spoolLabel(s)) + '</h2>' +
    '<div class="sub">' + fmtG(spoolTotal(s)) + ' au total · ' + (s.sealed || 0) +
      ' bobine' + ((s.sealed || 0) > 1 ? 's' : '') + ' d\'avance</div>' +

    '<div class="sec-title">Bobine entamée</div>' +
    '<div class="chips">' + steps.map(st =>
      '<button type="button" class="chip" data-r="' + st.r + '">' + st.l + '</button>').join('') + '</div>' +
    '<div class="sp"></div>' +
    '<div class="chips">' + [50, 100, 250, 500].map(g =>
      '<button type="button" class="chip" data-g="' + g + '">−' + g + ' g</button>').join('') + '</div>' +

    '<div class="sec-title">Bobines neuves en réserve</div>' +
    '<div class="row" style="gap:10px">' +
      '<button class="btn" data-sealed="-1">−1</button>' +
      '<div class="grow" style="text-align:center">' +
        '<div class="clock" id="sealed-n" style="font-size:26px">' + (s.sealed || 0) + '</div>' +
        '<div class="card-meta">soit ' + fmtG(size) + ' chacune</div>' +
      '</div>' +
      '<button class="btn" data-sealed="1">+1</button>' +
    '</div>' +
    '<div class="sp"></div>' +
    '<div class="chips">' + [5, 10].map(n =>
      '<button type="button" class="chip" data-sealed="' + n + '">+' + n + ' bobines</button>').join('') +
      ((s.sealed || 0) > 0 ? '<button type="button" class="chip" data-open="1">Ouvrir une neuve</button>' : '') +
    '</div>' +

    '<div class="sheet-actions"><button class="btn primary" data-x="no">Terminé</button></div>',

    root => {
      const refresh = () => { $('#sealed-n', root).textContent = s.sealed || 0; save(); };
      $('[data-x=no]', root).onclick = () => { closeSheet(); render(); afterLevel(s); };

      $$('[data-r]', root).forEach(b => b.onclick = () => {
        s.open = Math.round(size * parseFloat(b.getAttribute('data-r')));
        closeSheet(); save(); render(); afterLevel(s);
      });
      $$('[data-g]', root).forEach(b => b.onclick = () => {
        consumeSpool(s, parseInt(b.getAttribute('data-g'), 10));
        closeSheet(); save(); render(); afterLevel(s);
      });
      $$('[data-sealed]', root).forEach(b => b.onclick = () => {
        const d = parseInt(b.getAttribute('data-sealed'), 10);
        s.sealed = Math.max(0, (s.sealed || 0) + d);
        refresh();
        toast(s.sealed + ' bobine' + (s.sealed > 1 ? 's' : '') + ' en réserve');
      });
      const openBtn = $('[data-open]', root);
      if (openBtn) openBtn.onclick = () => {
        if ((s.sealed || 0) <= 0) return;
        s.sealed--;
        s.open = size;
        closeSheet(); save(); render();
        toast('Nouvelle bobine ouverte', 'ok');
      };
    }
  );
}

function afterLevel(s) {
  if (spoolTotal(s) <= 0) {
    confirmSheet('Référence épuisée', spoolLabel(s) + ' — la ranger dans les archives ?', 'Archiver', () => {
      s.archived = true;
      DB.machines.forEach(m => { if (m.filamentId === s.id) m.filamentId = ''; });
      save(); render(); toast('Référence archivée');
    });
  } else if (needsRestock(s)) {
    toast(spoolLabel(s) + ' : à racheter', 'bad');
  }
}

/* ---------- fiche ---------- */

function editSpool(id) {
  const s = id ? spoolById(id) : null;
  sheet(
    '<h2>' + (s ? 'Modifier la référence' : 'Nouveau filament') + '</h2>' +
    (s ? '' : '<div class="sub">Une seule fiche par référence : indique combien de bobines tu as, pas besoin d\'en créer une par une.</div>') +

    '<label class="field"><span>Marque</span>' +
      '<input type="text" name="brand" placeholder="Sunlu, Creality…" value="' + esc(s ? s.brand : '') + '"></label>' +
    '<label class="field"><span>Matière</span>' + materialChips('material', s ? s.material : 'PLA') + '</label>' +
    '<label class="field"><span>Couleur</span>' + colorChips('color', s ? s.color : '') + '</label>' +

    '<div class="field-2">' +
      '<label class="field"><span>Bobines neuves</span>' +
        '<input type="number" name="sealed" inputmode="numeric" min="0" value="' + esc(s ? (s.sealed || 0) : 1) + '">' +
        '<div class="hint">Celles encore sous vide.</div>' +
      '</label>' +
      '<label class="field"><span>Poids d\'une bobine (g)</span>' +
        '<input type="number" name="spoolSize" inputmode="numeric" value="' + esc(s ? s.spoolSize : 1000) + '">' +
        '<div class="hint">1000 le plus souvent.</div>' +
      '</label>' +
    '</div>' +

    '<label class="field"><span>Restant sur la bobine entamée (g)</span>' +
      '<input type="number" name="open" inputmode="numeric" min="0" value="' + esc(s ? (s.open || 0) : 0) + '">' +
      '<div class="hint">Laisse à 0 si aucune n\'est ouverte. Ça s\'ajuste ensuite d\'un geste avec « Ajuster ».</div>' +
    '</label>' +

    '<label class="field"><span>Note</span>' +
      '<input type="text" name="note" placeholder="Matte, silk, lot…" value="' + esc(s ? s.note : '') + '"></label>' +

    '<div class="sheet-actions">' +
      (s ? '<button class="btn danger" data-x="del">Supprimer</button>' : '') +
      '<button class="btn ghost" data-x="no">Annuler</button>' +
      '<button class="btn primary" data-x="ok">Enregistrer</button>' +
    '</div>',

    root => {
      const chips = bindChips(root);
      $('[data-x=no]', root).onclick = closeSheet;

      const del = $('[data-x=del]', root);
      if (del) del.onclick = () => {
        closeSheet();
        confirmSheet('Supprimer cette référence ?', spoolLabel(s), 'Supprimer', () => {
          DB.spools = DB.spools.filter(x => x.id !== s.id);
          DB.machines.forEach(m => { if (m.filamentId === s.id) m.filamentId = ''; });
          save(); render(); toast('Référence supprimée');
        }, true);
      };

      $('[data-x=ok]', root).onclick = () => {
        const v = formValues(root), c = chips();
        const size = num(v.spoolSize, 1000) || 1000;
        const data = {
          brand: v.brand.trim(),
          material: c.material || 'PLA',
          color: c.color || '',
          colorHex: colorHexOf(c.color),
          spoolSize: size,
          sealed: Math.max(0, Math.round(num(v.sealed))),
          open: Math.max(0, num(v.open)),
          note: v.note.trim()
        };
        if (data.sealed === 0 && data.open === 0) {
          toast('Indique au moins une bobine', 'bad');
          return;
        }
        if (s) {
          Object.assign(s, data);
          if (spoolTotal(s) > 0) s.archived = false;
        } else {
          DB.spools.push(Object.assign({ id: uid(), archived: false, createdAt: Date.now() }, data));
        }
        save(); closeSheet(); render();
        toast(fmtG(data.sealed * size + data.open) + ' enregistrés', 'ok');
      };
    }
  );
}

/* ---------- archives ---------- */

function showArchived() {
  const arch = DB.spools.filter(s => s.archived);
  sheet(
    '<h2>Références épuisées</h2>' +
    '<div class="sub">' + arch.length + ' référence' + (arch.length > 1 ? 's' : '') + ' sortie' +
      (arch.length > 1 ? 's' : '') + ' du stock.</div>' +
    arch.map(s =>
      '<div class="rowitem">' + dot(s.colorHex) +
      '<div class="grow"><div class="t">' + esc(spoolLabel(s)) + '</div>' +
      '<div class="s">' + (s.note ? esc(s.note) + ' · ' : '') + fmtG(s.spoolSize || 1000) + ' la bobine</div></div>' +
      '<button class="btn sm ghost" onclick="restock(\'' + s.id + '\')">Racheté</button>' +
      '</div>'
    ).join('') +
    '<div class="sheet-actions"><button class="btn ghost" data-x="no">Fermer</button></div>',
    root => { $('[data-x=no]', root).onclick = closeSheet; }
  );
}

function restock(id) {
  const s = spoolById(id);
  if (!s) return;
  closeSheet();
  s.archived = false;
  if (spoolTotal(s) <= 0) s.sealed = 1;
  save(); render();
  editSpool(id);
}
</script>
<script>
/* ============================================================
   orders.js — commandes Shopify, poids, besoins matière
   ============================================================ */

const ORDER_STATUS = {
  todo:     { label: 'À imprimer', cls: '' },
  printing: { label: 'En cours',   cls: 'acc' },
  done:     { label: 'Imprimée',   cls: 'ok' },
  shipped:  { label: 'Expédiée',   cls: 'info' }
};

function renderOrders() {
  const todo = DB.orders.filter(o => o.status !== 'shipped' && o.status !== 'done');
  const last = DB.settings.lastSync
    ? 'synchro ' + fmtDayClock(DB.settings.lastSync)
    : 'jamais synchronisé';

  setTop('Commandes',
    DB.orders.length ? todo.length + ' à produire · ' + last : 'Aucune commande',
    '<button class="tb-btn" onclick="addManualOrder()">' + iconPlus() + '</button>' +
    '<button class="tb-btn accent" id="sync-btn" onclick="syncShopify()">' + iconSync() + 'Shopify</button>'
  );

  if (!DB.orders.length) {
    return (DB.settings.token ? '' : '<div class="info-box" style="margin-bottom:12px">Renseigne ta boutique et ton jeton d\'accès dans Réglages pour récupérer les commandes automatiquement.</div>') +
      emptyState('Aucune commande', 'Récupère-les depuis Shopify, ou saisis-en une à la main.', 'Synchroniser Shopify', 'syncShopify()');
  }

  let out = '';
  const groups = [
    ['À produire', DB.orders.filter(o => o.status === 'todo' || o.status === 'printing')],
    ['Imprimées', DB.orders.filter(o => o.status === 'done')],
    ['Expédiées', DB.orders.filter(o => o.status === 'shipped')]
  ];

  groups.forEach(([title, list]) => {
    if (!list.length) return;
    list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    out += '<div class="sec-title">' + title + ' · ' + list.length + '</div><div class="stack">';
    out += list.map(orderCard).join('');
    out += '</div>';
  });

  return out;
}

function orderCard(o) {
  const st = ORDER_STATUS[o.status] || ORDER_STATUS.todo;
  const v = orderStockVerdict(o);
  const lines = o.lines || [];
  const doneN = lines.filter(l => l.done).length;
  const totalG = lines.reduce((t, l) => t + (l.grams || 0) * (l.qty || 1), 0);
  const noWeight = lines.some(l => !l.grams);

  return '<div class="card tight click" onclick="openOrder(\'' + o.id + '\')">' +
    '<div class="card-head">' +
      '<div class="grow">' +
        '<div class="card-name">' + esc(o.name) +
          (o.customer ? ' · <span class="muted" style="font-weight:500">' + esc(o.customer) + '</span>' : '') + '</div>' +
        '<div class="card-meta">' + (o.createdAt ? fmtDate(o.createdAt) + ' · ' : '') +
          lines.length + ' pièce' + (lines.length > 1 ? 's' : '') +
          (doneN ? ' · ' + doneN + ' faite' + (doneN > 1 ? 's' : '') : '') +
          (totalG ? ' · ' + fmtG(totalG) : '') +
        '</div>' +
      '</div>' +
      badge(st.cls, st.label) +
    '</div>' +
    '<div class="row wrap" style="margin-top:10px;gap:6px">' +
      (noWeight ? badge('warn', 'Poids à saisir') : badge(v.cls, v.label)) +
      lineMaterialBadges(o) +
    '</div>' +
  '</div>';
}

function lineMaterialBadges(o) {
  const mats = {};
  (o.lines || []).forEach(l => {
    const k = (l.material || '?') + '|' + (l.color || '');
    mats[k] = { m: l.material || '?', c: l.color || '' };
  });
  return Object.values(mats).map(x =>
    '<span class="badge">' + (x.c ? '<span class="dot" style="background:' + colorHexOf(x.c) + '"></span>' : '') +
    esc(x.m) + (x.c ? ' ' + esc(x.c) : '') + '</span>'
  ).join('');
}

/* ---------- détail d'une commande ---------- */

function openOrder(id) {
  const o = orderById(id);
  if (!o) return;
  const v = orderStockVerdict(o);

  sheet(
    '<h2>' + esc(o.name) + '</h2>' +
    '<div class="sub">' + esc(o.customer || 'Commande Shopify') + (o.createdAt ? ' · ' + fmtDate(o.createdAt) : '') +
      (o.country ? ' · ' + esc(o.country) : '') + '</div>' +

    '<div class="chips" style="margin-bottom:14px">' +
      Object.keys(ORDER_STATUS).map(k =>
        '<button type="button" class="chip' + (o.status === k ? ' on' : '') + '" onclick="setOrderStatus(\'' + o.id + '\',\'' + k + '\')">' +
        ORDER_STATUS[k].label + '</button>').join('') +
    '</div>' +

    '<div class="card tight" style="margin-bottom:14px">' +
      '<div class="spread"><span class="small muted">Stock pour cette commande</span>' + badge(v.cls, v.label) + '</div>' +
      orderNeeds(o).map(n =>
        '<div class="kv"><span>' + esc(n.material) + (n.color ? ' · ' + esc(n.color) : '') + '</span>' +
        '<b class="mono">' + fmtG(n.grams) + ' / ' + fmtG(stockFor(n.material, n.color)) + '</b></div>'
      ).join('') +
    '</div>' +

    '<div class="sec-title">Pièces</div>' +
    (o.lines || []).map(l => orderLineRow(o, l)).join('') +

    '<div class="sheet-actions">' +
      '<button class="btn danger" onclick="deleteOrder(\'' + o.id + '\')">Supprimer</button>' +
      '<button class="btn ghost" onclick="closeSheet()">Fermer</button>' +
    '</div>'
  );
}

function orderLineRow(o, l) {
  return '<div class="rowitem">' +
    '<div class="grow" style="' + (l.done ? 'opacity:.5' : '') + '">' +
      '<div class="t">' + esc(l.title) + (l.qty > 1 ? ' ×' + l.qty : '') + '</div>' +
      '<div class="s">' + esc(l.variant || '') + '</div>' +
      '<div class="row" style="gap:6px;margin-top:6px">' +
        '<span class="badge' + (l.material ? '' : ' warn') + '">' + esc(l.material || 'Matière ?') + '</span>' +
        (l.color ? '<span class="badge">' + dot(colorHexOf(l.color)) + esc(l.color) + '</span>' : '') +
        '<span class="badge' + (l.grams ? '' : ' warn') + '">' + (l.grams ? fmtG(l.grams) : 'Poids ?') + '</span>' +
      '</div>' +
    '</div>' +
    '<button class="btn sm ghost" onclick="editLine(\'' + o.id + '\',\'' + l.id + '\')">' + iconGear() + '</button>' +
  '</div>';
}

function editLine(orderId, lineId) {
  const o = orderById(orderId);
  const l = o && (o.lines || []).find(x => x.id === lineId);
  if (!l) return;
  const remembered = rememberedWeight(l);

  sheet(
    '<h2>' + esc(l.title) + '</h2>' +
    '<div class="sub">' + esc(l.variant || '') + '</div>' +

    '<label class="field"><span>Poids de la pièce (g)</span>' +
      '<input type="number" name="grams" inputmode="numeric" value="' + esc(l.grams || '') + '" placeholder="' + (remembered || 0) + '">' +
      '<div class="hint">' + (remembered ? 'Dernier poids retenu pour cette variante : ' + fmtG(remembered) + '. ' : '') +
      'Poids unitaire ; la quantité (×' + (l.qty || 1) + ') est appliquée automatiquement.</div>' +
    '</label>' +

    '<label class="field"><span>Matière</span>' + materialChips('material', l.material) + '</label>' +
    '<label class="field"><span>Couleur</span>' + colorChips('color', l.color) + '</label>' +

    '<label class="field row" style="gap:9px;align-items:center">' +
      '<input type="checkbox" name="done"' + (l.done ? ' checked' : '') + ' style="width:auto">' +
      '<span style="margin:0">Pièce imprimée</span>' +
    '</label>' +

    '<div class="sheet-actions">' +
      '<button class="btn ghost" data-x="no">Annuler</button>' +
      '<button class="btn primary" data-x="ok">Enregistrer</button>' +
    '</div>',

    root => {
      const chips = bindChips(root);
      $('[data-x=no]', root).onclick = () => { closeSheet(); openOrder(orderId); };
      $('[data-x=ok]', root).onclick = () => {
        const v = formValues(root), c = chips();
        l.grams = num(v.grams) || remembered || 0;
        l.material = c.material || l.material;
        l.color = c.color || l.color;
        l.done = !!v.done;
        rememberWeight(l, l.grams);
        const lines = o.lines || [];
        if (lines.length && lines.every(x => x.done) && o.status !== 'shipped') o.status = 'done';
        else if (o.status === 'done' && lines.some(x => !x.done)) o.status = 'printing';
        save(); closeSheet(); render(); openOrder(orderId);
      };
    }
  );
}

function setOrderStatus(id, st) {
  const o = orderById(id);
  if (!o) return;
  o.status = st;
  if (st === 'done' || st === 'shipped') (o.lines || []).forEach(l => l.done = true);
  save(); closeSheet(); render(); toast(ORDER_STATUS[st].label, 'ok');
}

function deleteOrder(id) {
  const o = orderById(id);
  if (!o) return;
  closeSheet();
  confirmSheet('Supprimer ' + o.name + ' ?', 'La commande reste bien sûr dans Shopify.', 'Supprimer', () => {
    DB.orders = DB.orders.filter(x => x.id !== id);
    save(); render(); toast('Commande retirée');
  }, true);
}

function addManualOrder() {
  sheet(
    '<h2>Commande manuelle</h2>' +
    '<div class="sub">Pour une pièce hors boutique : commission, prototype, rechange.</div>' +
    '<label class="field"><span>Référence</span><input type="text" name="name" placeholder="Commission Rémi"></label>' +
    '<label class="field"><span>Client</span><input type="text" name="customer" placeholder="Nom"></label>' +
    '<label class="field"><span>Pièce</span><input type="text" name="title" placeholder="Casque Mando"></label>' +
    '<div class="field-2">' +
      '<label class="field"><span>Poids (g)</span><input type="number" name="grams" inputmode="numeric" placeholder="450"></label>' +
      '<label class="field"><span>Quantité</span><input type="number" name="qty" inputmode="numeric" value="1"></label>' +
    '</div>' +
    '<label class="field"><span>Matière</span>' + materialChips('material', 'PLA') + '</label>' +
    '<label class="field"><span>Couleur</span>' + colorChips('color', '') + '</label>' +
    '<div class="sheet-actions">' +
      '<button class="btn ghost" data-x="no">Annuler</button>' +
      '<button class="btn primary" data-x="ok">Créer</button>' +
    '</div>',
    root => {
      const chips = bindChips(root);
      $('[data-x=no]', root).onclick = closeSheet;
      $('[data-x=ok]', root).onclick = () => {
        const v = formValues(root), c = chips();
        if (!v.name.trim() && !v.title.trim()) { toast('Il faut au moins une référence', 'bad'); return; }
        DB.orders.push({
          id: uid(), shopifyId: '', name: v.name.trim() || v.title.trim(),
          customer: v.customer.trim(), createdAt: Date.now(), source: 'manual', status: 'todo',
          lines: [{
            id: uid(), title: v.title.trim() || v.name.trim(), variant: '',
            qty: parseInt(v.qty, 10) || 1, grams: num(v.grams),
            material: c.material || 'PLA', color: c.color || '', done: false
          }]
        });
        save(); closeSheet(); render(); toast('Commande ajoutée', 'ok');
      };
    }
  );
}

/* ============================================================
   Synchronisation Shopify (API Admin GraphQL)
   ============================================================ */

/* Requete volontairement minimale : elle ne demande que ce que couvre
   read_orders. Pas de bloc customer (read_customers) ni variant
   (read_products) — variantTitle porte deja la matiere. */
const ORDERS_QUERY =
  'query($n:Int!,$q:String){orders(first:$n,query:$q,sortKey:CREATED_AT,reverse:true){edges{node{' +
  'id name createdAt displayFulfillmentStatus ' +
  'lineItems(first:50){edges{node{id title quantity sku variantTitle}}}' +
  '}}}}';

let syncing = false;

async function syncShopify() {
  if (syncing) return;
  const st = DB.settings;
  if (!st.shop || !st.token) {
    toast('Configure la boutique dans Réglages', 'bad');
    go('settings');
    return;
  }
  if (!Native.ok()) {
    toast('La synchro ne fonctionne que dans l\'app Android', 'bad');
    return;
  }

  syncing = true;
  const btn = $('#sync-btn');
  if (btn) { btn.textContent = 'Synchro…'; btn.disabled = true; }

  try {
    const url = 'https://' + st.shop.replace(/^https?:\/\//, '').replace(/\/$/, '') +
                '/admin/api/' + st.apiVersion + '/graphql.json';
    const res = await nativeHttp('POST', url,
      { 'X-Shopify-Access-Token': st.token, 'Content-Type': 'application/json' },
      JSON.stringify({ query: ORDERS_QUERY, variables: { n: 50, q: 'fulfillment_status:unfulfilled' } })
    );

    if (!res.ok) throw new Error(res.error || ('HTTP ' + res.status));
    const data = JSON.parse(res.body);
    if (data.errors) throw new Error(data.errors[0] && data.errors[0].message || 'Erreur GraphQL');
    if (!data.data || !data.data.orders) throw new Error('Réponse inattendue — vérifie les autorisations du jeton');

    const n = mergeShopifyOrders(data.data.orders.edges.map(e => e.node));
    DB.settings.lastSync = Date.now();
    save(); render();
    toast(n.added ? n.added + ' nouvelle' + (n.added > 1 ? 's' : '') + ' commande' + (n.added > 1 ? 's' : '') : 'Tout est à jour', 'ok');
  } catch (e) {
    toast('Échec : ' + e.message, 'bad');
  } finally {
    syncing = false;
    render();
  }
}

function mergeShopifyOrders(nodes) {
  let added = 0;
  nodes.forEach(nd => {
    const existing = DB.orders.find(o => o.shopifyId === nd.id);
    const cust = nd.customer ? [nd.customer.firstName, nd.customer.lastName].filter(Boolean).join(' ') : '';
    const lines = (nd.lineItems.edges || []).map(e => {
      const li = e.node;
      const variant = li.variantTitle || (li.variant ? li.variant.title : '');
      const base = {
        id: li.id, title: li.title, variant: variant,
        qty: li.quantity || 1, material: materialFromVariant(variant),
        color: '', grams: 0, done: false
      };
      const w = rememberedWeight(base);
      if (w) base.grams = w;
      return base;
    });

    if (existing) {
      existing.customer = cust || existing.customer;
      if (nd.shippingAddress) existing.country = nd.shippingAddress.country;
      lines.forEach(nl => {
        if (!(existing.lines || []).some(x => x.id === nl.id)) (existing.lines = existing.lines || []).push(nl);
      });
    } else {
      added++;
      DB.orders.push({
        id: uid(), shopifyId: nd.id, name: nd.name, customer: cust,
        createdAt: new Date(nd.createdAt).getTime(),
        country: nd.shippingAddress ? nd.shippingAddress.country : '',
        source: 'shopify', status: 'todo', lines: lines
      });
    }
  });
  return { added: added };
}
</script>
<script>
/* ============================================================
   profiles.js — profils d'impression réutilisables
   ============================================================ */

function renderProfiles() {
  setTop('Profils',
    DB.profiles.length ? DB.profiles.length + ' profil' + (DB.profiles.length > 1 ? 's' : '') + ' enregistré' + (DB.profiles.length > 1 ? 's' : '') : 'Aucun profil',
    '<button class="tb-btn accent" onclick="editProfile()">' + iconPlus() + 'Profil</button>'
  );

  if (!DB.profiles.length) {
    return emptyState(
      'Aucun profil',
      'Un profil regroupe tes réglages habituels : matière, buse, hauteur de couche, températures. Tu peux ensuite l\'affecter à une machine.',
      'Créer un profil', 'editProfile()'
    );
  }

  return '<div class="stack">' + DB.profiles.map(profileCard).join('') + '</div>';
}

function profileCard(p) {
  const used = DB.machines.filter(m => m.profileId === p.id).map(m => m.name);
  const specs = [
    p.layer ? p.layer + ' mm' : '',
    p.nozzle ? 'buse ' + p.nozzle : '',
    p.infill ? p.infill + ' %' : '',
    p.speed ? p.speed + ' mm/s' : ''
  ].filter(Boolean).join(' · ');

  return '<div class="card tight click" onclick="editProfile(\'' + p.id + '\')">' +
    '<div class="card-head">' +
      '<div class="grow">' +
        '<div class="card-name" style="font-size:15px">' + esc(p.name) + '</div>' +
        '<div class="card-meta">' + esc(specs || 'Aucun réglage détaillé') + '</div>' +
      '</div>' +
      badge('', p.material || '—') +
    '</div>' +
    (p.tempNozzle || p.tempBed
      ? '<div class="card-meta" style="margin-top:8px">' +
        (p.tempNozzle ? 'Buse ' + esc(p.tempNozzle) + ' °C' : '') +
        (p.tempNozzle && p.tempBed ? ' · ' : '') +
        (p.tempBed ? 'Plateau ' + esc(p.tempBed) + ' °C' : '') + '</div>'
      : '') +
    (p.note ? '<div class="card-meta" style="margin-top:6px">' + esc(p.note) + '</div>' : '') +
    (used.length ? '<div class="fil-line"><span class="grow small">Utilisé sur ' + esc(used.join(', ')) + '</span></div>' : '') +
  '</div>';
}

function editProfile(id) {
  const p = id ? profileById(id) : null;
  sheet(
    '<h2>' + (p ? 'Modifier le profil' : 'Nouveau profil') + '</h2>' +
    '<label class="field"><span>Nom</span><input type="text" name="name" placeholder="Casque — PLA Matte fuzzy" value="' + esc(p ? p.name : '') + '"></label>' +
    '<label class="field"><span>Matière</span>' + materialChips('material', p ? p.material : 'PLA') + '</label>' +
    '<div class="field-2">' +
      '<label class="field"><span>Hauteur de couche (mm)</span><input type="text" name="layer" inputmode="decimal" placeholder="0.2" value="' + esc(p ? p.layer : '') + '"></label>' +
      '<label class="field"><span>Buse (mm)</span><input type="text" name="nozzle" inputmode="decimal" placeholder="0.4" value="' + esc(p ? p.nozzle : '') + '"></label>' +
    '</div>' +
    '<div class="field-2">' +
      '<label class="field"><span>Remplissage (%)</span><input type="number" name="infill" inputmode="numeric" placeholder="15" value="' + esc(p ? p.infill : '') + '"></label>' +
      '<label class="field"><span>Vitesse (mm/s)</span><input type="number" name="speed" inputmode="numeric" placeholder="200" value="' + esc(p ? p.speed : '') + '"></label>' +
    '</div>' +
    '<div class="field-2">' +
      '<label class="field"><span>Temp. buse (°C)</span><input type="number" name="tempNozzle" inputmode="numeric" placeholder="220" value="' + esc(p ? p.tempNozzle : '') + '"></label>' +
      '<label class="field"><span>Temp. plateau (°C)</span><input type="number" name="tempBed" inputmode="numeric" placeholder="60" value="' + esc(p ? p.tempBed : '') + '"></label>' +
    '</div>' +
    '<label class="field"><span>Notes</span><textarea name="note" placeholder="Fuzzy skin 0.3 / Voronoï, supports arbre, séchage 6 h…">' + esc(p ? p.note : '') + '</textarea></label>' +
    '<div class="sheet-actions">' +
      (p ? '<button class="btn danger" data-x="del">Supprimer</button>' : '') +
      '<button class="btn ghost" data-x="no">Annuler</button>' +
      '<button class="btn primary" data-x="ok">Enregistrer</button>' +
    '</div>',
    root => {
      const chips = bindChips(root);
      $('[data-x=no]', root).onclick = closeSheet;
      const del = $('[data-x=del]', root);
      if (del) del.onclick = () => {
        closeSheet();
        confirmSheet('Supprimer ce profil ?', p.name, 'Supprimer', () => {
          DB.profiles = DB.profiles.filter(x => x.id !== p.id);
          DB.machines.forEach(m => { if (m.profileId === p.id) m.profileId = ''; });
          save(); render(); toast('Profil supprimé');
        }, true);
      };
      $('[data-x=ok]', root).onclick = () => {
        const v = formValues(root), c = chips();
        if (!v.name.trim()) { toast('Il faut un nom', 'bad'); return; }
        const data = {
          name: v.name.trim(), material: c.material || 'PLA',
          layer: v.layer.trim(), nozzle: v.nozzle.trim(), infill: v.infill,
          speed: v.speed, tempNozzle: v.tempNozzle, tempBed: v.tempBed, note: v.note.trim()
        };
        if (p) Object.assign(p, data);
        else DB.profiles.push(Object.assign({ id: uid() }, data));
        save(); closeSheet(); render(); toast('Enregistré', 'ok');
      };
    }
  );
}
</script>
<script>
/* ============================================================
   settings.js — Shopify, notifications, sauvegarde
   ============================================================ */

function renderSettings() {
  const st = DB.settings;
  setTop('Réglages', Native.ok() ? 'Application Android' : 'Aperçu navigateur', '');

  let out = '';

  /* ---- Shopify ---- */
  out += '<div class="sec-title">Boutique Shopify</div>' +
    '<div class="card">' +
      '<label class="field"><span>Domaine myshopify</span>' +
        '<input type="text" name="shop" value="' + esc(st.shop) + '" placeholder="hedjfd-9e.myshopify.com" autocapitalize="off" autocorrect="off">' +
        '<div class="hint">Le domaine technique, pas nmtsworkshop.com.</div>' +
      '</label>' +
      '<label class="field"><span>Jeton d\'accès Admin API</span>' +
        '<input type="password" name="token" value="' + esc(st.token) + '" placeholder="shpat_…" autocapitalize="off" autocorrect="off">' +
        '<div class="hint">Jeton de l\'app Atelier NMT. Seule autorisation nécessaire : read_orders. Le jeton reste sur le téléphone.</div>' +
      '</label>' +
      '<label class="field"><span>Version d\'API</span>' +
        '<input type="text" name="apiVersion" value="' + esc(st.apiVersion) + '" placeholder="2026-04">' +
      '</label>' +
      '<div class="btn-row">' +
        '<button class="btn" onclick="saveSettings()">Enregistrer</button>' +
        '<button class="btn primary" onclick="testShopify()">Tester</button>' +
      '</div>' +
    '</div>';

  /* ---- notifications ---- */
  out += '<div class="sec-title">Notifications</div>' +
    '<div class="card">' +
      '<label class="field"><span>Prévenir avant la fin</span>' +
        '<select name="notifyBefore">' +
          [0, 5, 10, 15, 30].map(v =>
            '<option value="' + v + '"' + (st.notifyBefore === v ? ' selected' : '') + '>' +
            (v === 0 ? 'Non, seulement à la fin' : v + ' minutes avant') + '</option>').join('') +
        '</select>' +
      '</label>' +
      '<label class="field"><span>Seuil « bientôt vide »</span>' +
        '<select name="lowThreshold">' +
          [10, 15, 20, 25].map(v =>
            '<option value="' + v + '"' + (st.lowThreshold === v ? ' selected' : '') + '>' + v + ' % de la bobine</option>').join('') +
        '</select>' +
      '</label>' +
      '<div class="btn-row">' +
        '<button class="btn" onclick="saveSettings()">Enregistrer</button>' +
        '<button class="btn primary" onclick="testNotif()">Tester</button>' +
      '</div>' +
      (Native.ok()
        ? '<div class="sp"></div><div class="hint">Si les notifications arrivent en retard, retire l\'app de l\'optimisation de batterie.' +
          '<br><button class="btn sm" style="margin-top:9px" onclick="Native.openBatterySettings()">Ouvrir les réglages batterie</button></div>'
        : '<div class="sp"></div><div class="warn-box">Dans un navigateur, les notifications en arrière-plan ne fonctionnent pas. C\'est tout l\'intérêt de la version Android.</div>')
    + '</div>';

  /* ---- données ---- */
  const counts = DB.machines.length + ' machines · ' + activeSpools().length + ' bobines · ' +
                 DB.orders.length + ' commandes · ' + DB.profiles.length + ' profils';
  out += '<div class="sec-title">Sauvegarde</div>' +
    '<div class="card">' +
      '<div class="small muted" style="margin-bottom:12px">' + esc(counts) + '</div>' +
      '<div class="btn-row">' +
        '<button class="btn" onclick="exportData()">Exporter</button>' +
        '<button class="btn" onclick="importData()">Importer</button>' +
      '</div>' +
      '<div class="sp"></div>' +
      '<button class="btn wide danger" onclick="resetData()">Tout effacer</button>' +
    '</div>';

  out += '<div class="sec-title">Mise à jour</div>' +
    '<div class="card">' +
      '<div class="kv"><span>Version installée</span><b>' + esc(Native.version()) + '</b></div>' +
      '<div id="maj-out" class="small muted" style="margin:12px 0 0">' +
        (Native.ok() ? 'Appuie pour voir s\'il y a du nouveau.' : 'Disponible seulement dans l\'application.') +
      '</div>' +
      '<div class="sp"></div>' +
      '<button class="btn wide primary" onclick="checkUpdate()">Rechercher une mise à jour</button>' +
    '</div>';

  out += '<div class="sec-title">À propos</div>' +
    '<div class="card">' +
      '<div class="kv"><span>Application</span><b>Atelier NMT</b></div>' +
      '<div class="kv"><span>Données</span><b>Stockées sur l\'appareil</b></div>' +
      '<div class="kv"><span>Machines branchées</span><b>' +
        DB.machines.filter(m => m.printer && m.printer.host).length + ' sur ' + DB.machines.length + '</b></div>' +
    '</div>';

  return out;
}

/* ---------- mise à jour ---------- */

function checkUpdate(silencieux) {
  const out = $('#maj-out');
  if (!Native.ok()) { if (out) out.textContent = 'Disponible seulement dans l\'application.'; return; }
  if (out && !silencieux) out.textContent = 'Recherche…';

  DB.settings.lastUpdateCheck = Date.now();
  save();

  nativeCall('checkUpdate', []).then(r => {
    if (!r || !r.ok) {
      if (out && !silencieux) out.innerHTML = '<span style="color:var(--bad)">Échec — ' +
        esc((r && r.error) || 'sans réponse') + '</span>';
      return;
    }
    if (!r.available) {
      if (out && !silencieux) out.textContent = 'Tu es à jour (version ' + esc(r.current) + ').';
      return;
    }
    proposeUpdate(r);
  }).catch(e => {
    if (out && !silencieux) out.innerHTML = '<span style="color:var(--bad)">Échec — ' + esc(e.message) + '</span>';
  });
}

function proposeUpdate(r) {
  sheet(
    '<h2>Version ' + esc(r.version) + ' disponible</h2>' +
    '<div class="sub">Tu es en ' + esc(r.current) + '. L\'installation se fait sur place, tes données sont conservées.</div>' +
    (r.notes ? '<div class="card tight small" style="margin-bottom:14px;white-space:pre-wrap">' +
        esc(String(r.notes).slice(0, 400)) + '</div>' : '') +
    '<div class="sheet-actions">' +
      '<button class="btn ghost" data-x="no">Plus tard</button>' +
      '<button class="btn primary" data-x="ok">Installer</button>' +
    '</div>',
    root => {
      $('[data-x=no]', root).onclick = closeSheet;
      $('[data-x=ok]', root).onclick = () => {
        const btn = $('[data-x=ok]', root);
        btn.textContent = 'Téléchargement…';
        btn.disabled = true;
        nativeCall('installUpdate', [r.url]).then(res => {
          if (res && res.ok) {
            closeSheet();
            toast('Installateur ouvert', 'ok');
          } else if (res && res.needPermission) {
            closeSheet();
            confirmSheet('Autorisation requise',
              'Android demande la permission d\'installer des applications depuis Atelier NMT. Une fois accordée, relance la mise à jour.',
              'Ouvrir les réglages', () => Native.openInstallPermission());
          } else {
            btn.textContent = 'Réessayer';
            btn.disabled = false;
            toast('Échec : ' + ((res && res.error) || 'inconnu'), 'bad');
          }
        }).catch(e => {
          btn.textContent = 'Réessayer';
          btn.disabled = false;
          toast('Échec : ' + e.message, 'bad');
        });
      };
    }
  );
}

/* vérification discrète au démarrage, une fois par jour */
function autoCheckUpdate() {
  if (!Native.ok()) return;
  const last = DB.settings.lastUpdateCheck || 0;
  if (Date.now() - last < 20 * 3600000) return;
  checkUpdate(true);
}

function saveSettings() {
  const v = formValues($('#view'));
  DB.settings.shop = (v.shop || '').trim();
  DB.settings.token = (v.token || '').trim();
  DB.settings.apiVersion = (v.apiVersion || '2026-04').trim();
  DB.settings.notifyBefore = parseInt(v.notifyBefore, 10) || 0;
  DB.settings.lowThreshold = parseInt(v.lowThreshold, 10) || 15;
  save();
  toast('Réglages enregistrés', 'ok');
}

async function testShopify() {
  saveSettings();
  const st = DB.settings;
  if (!st.shop || !st.token) { toast('Domaine et jeton obligatoires', 'bad'); return; }
  if (!Native.ok()) { toast('Test possible seulement dans l\'app Android', 'bad'); return; }
  toast('Connexion…');
  try {
    const url = 'https://' + st.shop.replace(/^https?:\/\//, '').replace(/\/$/, '') +
                '/admin/api/' + st.apiVersion + '/graphql.json';
    const res = await nativeHttp('POST', url,
      { 'X-Shopify-Access-Token': st.token, 'Content-Type': 'application/json' },
      JSON.stringify({ query: '{shop{name}}' }));
    if (!res.ok) throw new Error(res.error || ('HTTP ' + res.status));
    const d = JSON.parse(res.body);
    if (d.errors) throw new Error(d.errors[0].message);
    toast('Connecté à ' + d.data.shop.name, 'ok');
  } catch (e) {
    toast('Échec : ' + e.message, 'bad');
  }
}

function testNotif() {
  saveSettings();
  if (!Native.ok()) { toast('Disponible seulement dans l\'app Android', 'bad'); return; }
  if (!Native.notificationsOk()) { Native.askNotifications(); return; }
  Native.scheduleTimer('test', 'Atelier NMT — test', 'Si tu lis ça écran verrouillé, tout est bon.', Date.now() + 60000);
  sheet(
    '<h2>Test lancé</h2>' +
    '<div class="sub">Une notification arrivera dans une minute. Verrouille l\'écran et laisse le téléphone de côté : c\'est exactement la situation d\'une fin d\'impression.</div>' +
    '<div class="sheet-actions"><button class="btn primary" onclick="closeSheet()">Compris</button></div>'
  );
}

function exportData() {
  const json = JSON.stringify(DB, null, 2);
  const name = 'atelier-nmt-' + new Date().toISOString().slice(0, 10) + '.json';
  const path = Native.saveFile(name, json);
  if (path) {
    sheet('<h2>Sauvegarde enregistrée</h2><div class="sub">' + esc(path) + '</div>' +
      '<div class="sheet-actions"><button class="btn primary" onclick="closeSheet()">Fermer</button></div>');
  } else {
    sheet(
      '<h2>Sauvegarde</h2><div class="sub">Copie ce texte et garde-le au chaud.</div>' +
      '<textarea style="min-height:200px" readonly>' + esc(json) + '</textarea>' +
      '<div class="sheet-actions"><button class="btn primary" onclick="closeSheet()">Fermer</button></div>',
      root => { const t = $('textarea', root); t.focus(); t.select(); }
    );
  }
}

function importData() {
  sheet(
    '<h2>Restaurer une sauvegarde</h2>' +
    '<div class="sub">Colle ici le contenu d\'un export. Les données actuelles seront remplacées.</div>' +
    '<textarea name="json" style="min-height:160px" placeholder="{ … }"></textarea>' +
    '<div class="sheet-actions">' +
      '<button class="btn ghost" data-x="no">Annuler</button>' +
      '<button class="btn primary" data-x="ok">Restaurer</button>' +
    '</div>',
    root => {
      $('[data-x=no]', root).onclick = closeSheet;
      $('[data-x=ok]', root).onclick = () => {
        try {
          const parsed = JSON.parse($('[name=json]', root).value);
          if (!parsed || !Array.isArray(parsed.machines)) throw new Error('format inattendu');
          DB = Object.assign(JSON.parse(JSON.stringify(DEFAULT_DB)), parsed);
          DB.settings = Object.assign({}, DEFAULT_DB.settings, parsed.settings || {});
          save(); closeSheet(); rescheduleAll(); render();
          toast('Sauvegarde restaurée', 'ok');
        } catch (e) {
          toast('Fichier illisible : ' + e.message, 'bad');
        }
      };
    }
  );
}

function resetData() {
  confirmSheet('Tout effacer ?', 'Machines, bobines, commandes et profils seront perdus. Pense à exporter avant.', 'Effacer', () => {
    DB.machines.forEach(m => Native.cancelTimer(m.id));
    DB = JSON.parse(JSON.stringify(DEFAULT_DB));
    save(); render(); toast('Données effacées');
  }, true);
}
</script>
<script>
/* ============================================================
   app.js — navigation, horloges, démarrage
   ============================================================ */

let TAB = 'machines';

const VIEWS = {
  machines: renderMachines,
  stock: renderStock,
  orders: renderOrders,
  profiles: renderProfiles,
  settings: renderSettings
};

function setTop(title, sub, actions) {
  $('#tb-title').textContent = title;
  $('#tb-sub').textContent = sub || '';
  $('#tb-actions').innerHTML = actions || '';
}

function go(tab) {
  TAB = tab;
  closeSheet();
  render();
  window.scrollTo(0, 0);
}

function render() {
  $('#view').innerHTML = (VIEWS[TAB] || renderMachines)();
  $$('#tabbar .tab').forEach(b => b.classList.toggle('on', b.getAttribute('data-tab') === TAB));
  paintTabBadges();
}

function paintTabBadges() {
  const done = DB.machines.filter(m => m.status === 'done').length;
  const tab = $('#tabbar .tab[data-tab=machines]');
  const old = $('.badge-n', tab);
  if (old) old.remove();
  if (done > 0 && TAB !== 'machines') {
    const b = document.createElement('span');
    b.className = 'badge-n';
    b.textContent = done;
    tab.appendChild(b);
  }
}

/* ---------- horloges ---------- */

function tick() {
  const now = Date.now();
  let needsRender = false;

  /* l'état des machines branchées est réécrit par la relève de fond :
     on le relit régulièrement plutôt que d'interroger le réseau ici */
  if (Printers.ok() && ++pollTicks >= 20) {
    pollTicks = 0;
    const before = JSON.stringify(PSTATES);
    Printers.refresh();
    if (JSON.stringify(PSTATES) !== before && TAB === 'machines') needsRender = true;
  }

  DB.machines.forEach(m => {
    if (m.status !== 'running' || !m.timer) return;
    const left = m.timer.endAt - now;
    if (left <= 0) {
      m.status = 'done';
      needsRender = true;
      save();
    } else if (TAB === 'machines') {
      const el = document.getElementById('clk-' + m.id);
      if (el) el.textContent = fmtDur(left);
    }
  });

  if (needsRender) render();
}

/* replanifie les alarmes natives d'après l'état courant
   (après une restauration de sauvegarde par exemple) */
function rescheduleAll() {
  DB.machines.forEach(m => {
    if (m.status === 'running' && m.timer && m.timer.endAt > Date.now()) scheduleFor(m);
  });
}

/* ---------- retour Android ---------- */

window.NMTonBack = function () {
  if (sheetCloser) { closeSheet(); return 1; }
  if (TAB !== 'machines') { go('machines'); return 1; }
  return 0;
};

/* ---------- démarrage ---------- */

let pollTicks = 0;

function boot() {
  load();
  Printers.refresh();
  Printers.push();

  $$('#tabbar .tab').forEach(b => {
    b.addEventListener('click', () => go(b.getAttribute('data-tab')));
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { load(); Printers.refresh(); render(); }
  });

  render();
  setInterval(tick, 1000);
  setTimeout(autoCheckUpdate, 2500);

  if (Native.ok() && !Native.notificationsOk()) {
    setTimeout(() => Native.askNotifications(), 600);
  }
}

document.addEventListener('DOMContentLoaded', boot);
</script>
