<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f131b">
<title>Atelier NMT</title>
<style>
:root{
  /* Palette reprise du thème de la boutique :
     bleu de marque #2cb2ff, gris bleuté #242833. */
  --bg:#0f131b;
  --bg-2:#151a24;
  --card:#1a202b;
  --card-2:#242833;
  --line:#2e3542;
  --line-soft:#232936;
  --txt:#e9edf3;
  --txt-2:#98a3b5;
  --txt-3:#6a7488;
  --acc:#2cb2ff;
  --acc-ink:#04243a;
  --acc-dim:#0d2d42;
  --ok:#3ecf8e;
  --ok-dim:#123026;
  --warn:#ffc043;
  --warn-dim:#392f13;
  --bad:#ff5f56;
  --bad-dim:#391d1c;
  --info:#9d8cff;
  --info-dim:#25214a;
  --r:14px;
  --r-s:10px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--txt);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:calc(66px + var(--safe-b));
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,select,textarea{font:inherit}

/* ---------- topbar ---------- */
#topbar{
  position:sticky;top:0;z-index:40;
  padding:calc(var(--safe-t) + 14px) 16px 12px;
  background:linear-gradient(180deg,var(--bg) 72%,rgba(15,19,27,0));
  display:flex;align-items:flex-start;gap:12px;
}
#tb-title{font-size:24px}
.tb-sub{font-size:12.5px;color:var(--txt-3);margin-top:3px}
.tb-left{flex:1;min-width:0}
.tb-right{display:flex;gap:8px;align-items:center;padding-top:2px}
.tb-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--card);border:1px solid var(--line);
  border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--txt-2);
}
.tb-btn.accent{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.tb-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- layout ---------- */
#view{padding:0 16px 28px;max-width:720px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
.sec-title{
  font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--txt-3);margin:20px 2px 9px;
}
.sec-title:first-child{margin-top:4px}
.sec-title .norm{text-transform:none;letter-spacing:0;color:var(--txt-3)}

/* ---------- card ---------- */
.card{
  background:var(--card);border:1px solid var(--line-soft);
  border-radius:var(--r);padding:14px;
}
.card.tight{padding:12px}
.card.click{transition:transform .08s}
.card.click:active{transform:scale(.988)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card-head.tap{cursor:pointer}
.card-name{font-size:16.5px;font-weight:650;line-height:1.25}
.card-meta{font-size:12.5px;color:var(--txt-3);margin-top:2px}

/* ---------- badge / pill ---------- */
.badge{
  display:inline-flex;align-items:center;gap:5px;flex-shrink:0;
  font-size:11.5px;font-weight:700;letter-spacing:.02em;
  padding:4px 9px;border-radius:99px;
  background:var(--card-2);color:var(--txt-2);
}
.badge.ok{background:var(--ok-dim);color:var(--ok)}
.badge.warn{background:var(--warn-dim);color:var(--warn)}
.badge.bad{background:var(--bad-dim);color:var(--bad)}
.badge.acc{background:var(--acc-dim);color:var(--acc)}
.badge.info{background:var(--info-dim);color:var(--info)}
.dot{width:9px;height:9px;border-radius:99px;flex-shrink:0;
  border:1px solid rgba(255,255,255,.3);box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.dot.lg{width:14px;height:14px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--card-2);border:1px solid var(--line);
  border-radius:var(--r-s);padding:10px 14px;
  font-size:14px;font-weight:600;color:var(--txt);
  transition:transform .08s,opacity .15s;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--bad-dim);border-color:#4d2626;color:var(--bad)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}

/* ---------- forms ---------- */
.field{display:block;margin-bottom:13px}
.field > span{display:block;font-size:12.5px;font-weight:600;color:var(--txt-2);margin-bottom:6px}
.field .hint{font-size:11.5px;color:var(--txt-3);font-weight:400;margin-top:5px;line-height:1.35}
input[type=text],input[type=number],input[type=password],input[type=time],select,textarea{
  width:100%;background:var(--bg-2);border:1px solid var(--line);
  border-radius:var(--r-s);padding:11px 12px;color:var(--txt);
  appearance:none;-webkit-appearance:none;
}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239aa3b2' stroke-width='2.2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;background-size:17px;padding-right:34px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
textarea{resize:vertical;min-height:70px}
.field-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  background:var(--bg-2);border:1px solid var(--line);border-radius:99px;
  padding:7px 13px;font-size:13px;font-weight:600;color:var(--txt-2);
}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chip.sw{padding:6px;width:34px;height:34px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center}
.chip.sw.on{box-shadow:0 0 0 2px var(--acc);border-color:transparent}
.chip.sw i{display:block;width:100%;height:100%;border-radius:99px;border:1px solid rgba(255,255,255,.2)}

/* ---------- gauge ---------- */
.gauge{height:7px;border-radius:99px;background:var(--bg-2);overflow:hidden;margin-top:9px}
.gauge > i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .3s}
.gauge > i.warn{background:var(--warn)}
.gauge > i.bad{background:var(--bad)}

/* ---------- machine card ---------- */
.mach{border-left:3px solid var(--line)}
.mach.running{border-left-color:var(--acc)}
.mach.done{border-left-color:var(--ok)}
.mach.paused{border-left-color:var(--warn)}
.clock{
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
  font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1;
}
.clock.done{color:var(--ok)}
.clock-sub{font-size:12px;color:var(--txt-3);margin-top:3px}
.fil-line{
  display:flex;align-items:center;gap:8px;margin-top:11px;padding-top:11px;
  border-top:1px solid var(--line-soft);font-size:13px;color:var(--txt-2);
}

/* ---------- list rows ---------- */
.rowitem{
  display:flex;align-items:center;gap:11px;padding:12px 0;
  border-bottom:1px solid var(--line-soft);
}
.rowitem:last-child{border-bottom:none}
.rowitem .t{font-size:14.5px;font-weight:600}
.rowitem .s{font-size:12px;color:var(--txt-3);margin-top:1px}

/* ---------- empty ---------- */
.empty{
  text-align:center;padding:42px 20px;color:var(--txt-3);
  border:1px dashed var(--line);border-radius:var(--r);
}
.empty h3{font-size:15px;color:var(--txt-2);margin-bottom:5px}
.empty p{font-size:13px;margin:0 0 14px;line-height:1.5}

/* ---------- tabbar ---------- */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;background:rgba(19,24,33,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line-soft);
  padding-bottom:var(--safe-b);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 2px 7px;color:var(--txt-3);font-size:10px;font-weight:600;
}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--acc)}
.tab .badge-n{
  position:absolute;transform:translate(13px,-4px);
  background:var(--acc);color:var(--acc-ink);font-size:9.5px;font-weight:800;
  min-width:15px;height:15px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 3px;
}

/* ---------- sheet (modal) ---------- */
.sheet-bg{
  position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fade .18s ease;
}
.sheet{
  width:100%;max-width:560px;max-height:90vh;overflow-y:auto;
  background:var(--bg-2);border:1px solid var(--line);border-bottom:none;
  border-radius:20px 20px 0 0;padding:8px 16px calc(20px + var(--safe-b));
  animation:up .22s cubic-bezier(.2,.8,.3,1);
}
.sheet-grip{width:38px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 14px}
.sheet h2{font-size:18px;margin-bottom:4px}
.sheet .sub{font-size:13px;color:var(--txt-3);margin-bottom:16px;line-height:1.4}
.sheet-actions{display:flex;gap:9px;margin-top:18px}
.sheet-actions .btn{flex:1}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(22px);opacity:.4}}

/* ---------- toast ---------- */
#toast-host{position:fixed;left:0;right:0;bottom:calc(76px + var(--safe-b));z-index:200;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:8px}
.toast{
  background:#2b3039;border:1px solid var(--line);color:var(--txt);
  padding:10px 16px;border-radius:99px;font-size:13.5px;font-weight:600;
  box-shadow:0 8px 26px rgba(0,0,0,.45);animation:up .2s;max-width:90vw;
}
.toast.ok{border-color:#2d5c48;color:var(--ok)}
.toast.bad{border-color:#5c2d2d;color:var(--bad)}

/* ---------- misc ---------- */
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13.5px;border-bottom:1px solid var(--line-soft)}
.kv:last-child{border-bottom:none}
.kv b{font-weight:600}
.kv span{color:var(--txt-3)}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--txt-3)}
.small{font-size:12.5px}
.nowrap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{height:4px}
.warn-box{background:var(--warn-dim);border:1px solid #4a3c18;color:#f0d08a;
  border-radius:var(--r-s);padding:11px 13px;font-size:13px;line-height:1.45}
.info-box{background:var(--info-dim);border:1px solid #1e3c5c;color:#a8cff5;
  border-radius:var(--r-s);padding:11px 13px;font-size:13px;line-height:1.45}
</style>
</head>
<body>

<header id="topbar">
  <div class="tb-left">
    <h1 id="tb-title">Machines</h1>
    <div id="tb-sub" class="tb-sub"></div>
  </div>
  <div class="tb-right" id="tb-actions"></div>
</header>

<main id="view"></main>

<nav id="tabbar">
  <button class="tab" data-tab="machines">
    <svg viewBox="0 0 24 24"><path d="M4 7h16v10H4z"/><path d="M7 7V4h10v3"/><path d="M8 17v3h8v-3"/></svg>
    <span>Machines</span>
  </button>
  <button class="tab" data-tab="stock">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
    <span>Stock</span>
  </button>
  <button class="tab" data-tab="orders">
    <svg viewBox="0 0 24 24"><path d="M5 7h14l-1 13H6L5 7z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg>
    <span>Commandes</span>
  </button>
  <button class="tab" data-tab="profiles">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="17" cy="18" r="2"/></svg>
    <span>Profils</span>
  </button>
  <button class="tab" data-tab="settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
    <span>Réglages</span>
  </button>
</nav>

<div id="sheet-host"></div>
<div id="toast-host"></div>

<script>
/* ============================================================
   store.js — état, persistance, modèle métier
   ============================================================ */

const KEY = 'nmt_atelier_v1';

const MATERIALS = ['PLA', 'PETG', 'ABS', 'ASA', 'TPU', 'PA-CF', 'Autre'];

const COLORS = [
  { n: 'Noir',      h: '#1b1b1d' },
  { n: 'Blanc',     h: '#f2f2f0' },
  { n: 'Gris',      h: '#8a8f96' },
  { n: 'Argent',    h: '#c7ccd2' },
  { n: 'Rouge',     h: '#c8362f' },
  { n: 'Bordeaux',  h: '#6d1f28' },
  { n: 'Orange',    h: '#e0761f' },
  { n: 'Jaune',     h: '#e3b724' },
  { n: 'Vert',      h: '#3d8a4f' },
  { n: 'Kaki',      h: '#6a6b45' },
  { n: 'Bleu',      h: '#2f5fa8' },
  { n: 'Bleu clair',h: '#6fa8dc' },
  { n: 'Violet',    h: '#6b4a9e' },
  { n: 'Rose',      h: '#d06a92' },
  { n: 'Marron',    h: '#6b4a32' },
  { n: 'Beige',     h: '#cbb994' },
  { n: 'Or',        h: '#b8913c' },
  { n: 'Transparent', h: '#9fb3bf' }
];

const DEFAULT_DB = {
  v: 1,
  machines: [],
  spools: [],
  profiles: [],
  orders: [],
  weights: {},
  settings: {
    shop: '',
    token: '',
    apiVersion: '2026-04',
    notifyBefore: 0,
    lowThreshold: 15,
    lastSync: 0,
    lastUpdateCheck: 0
  }
};

let DB = null;

/* ---------- persistance ---------- */

let memFallback = null;

function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { raw = memFallback; }
  if (!raw) { DB = JSON.parse(JSON.stringify(DEFAULT_DB)); return; }
  try {
    const parsed = JSON.parse(raw);
    DB = Object.assign(JSON.parse(JSON.stringify(DEFAULT_DB)), parsed);
    DB.settings = Object.assign({}, DEFAULT_DB.settings, parsed.settings || {});
  } catch (e) {
    DB = JSON.parse(JSON.stringify(DEFAULT_DB));
  }
  migrate();
}

/* ancien format : une fiche = une bobine ({initial, left}) */
function migrate() {
  (DB.spools || []).forEach(s => {
    if (s.spoolSize === undefined) {
      s.spoolSize = s.initial || 1000;
      s.open = s.left === undefined ? s.spoolSize : s.left;
      s.sealed = 0;
      delete s.initial;
      delete s.left;
    }
  });
}

function save() {
  const raw = JSON.stringify(DB);
  memFallback = raw;
  try { localStorage.setItem(KEY, raw); } catch (e) { /* mode privé / aperçu */ }
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

/* ---------- pont natif (APK) ---------- */

const Native = {
  ok() { return typeof window.NMT !== 'undefined'; },

  scheduleTimer(id, title, text, endAt) {
    if (!this.ok()) return false;
    try { window.NMT.scheduleTimer(String(id), String(title), String(text), Number(endAt)); return true; }
    catch (e) { return false; }
  },

  cancelTimer(id) {
    if (!this.ok()) return false;
    try { window.NMT.cancelTimer(String(id)); return true; } catch (e) { return false; }
  },

  notifyNow(title, text) {
    if (!this.ok()) return false;
    try { window.NMT.notifyNow(String(title), String(text)); return true; } catch (e) { return false; }
  },

  saveFile(name, content) {
    if (!this.ok()) return null;
    try { return window.NMT.saveFile(String(name), String(content)); } catch (e) { return null; }
  },

  exactAlarmsOk() {
    if (!this.ok()) return true;
    try { return !!window.NMT.exactAlarmsAllowed(); } catch (e) { return true; }
  },

  openExactAlarmSettings() {
    if (!this.ok()) return;
    try { window.NMT.openExactAlarmSettings(); } catch (e) {}
  },

  notificationsOk() {
    if (!this.ok()) return true;
    try { return !!window.NMT.notificationsAllowed(); } catch (e) { return true; }
  },

  askNotifications() {
    if (!this.ok()) return;
    try { window.NMT.requestNotifications(); } catch (e) {}
  },

  openBatterySettings() {
    if (!this.ok()) return;
    try { window.NMT.openBatterySettings(); } catch (e) {}
  },

  version() {
    if (!this.ok() || typeof window.NMT.appVersion !== 'function') return '—';
    try { return window.NMT.appVersion(); } catch (e) { return '—'; }
  },

  openInstallPermission() {
    if (!this.ok()) return;
    try { window.NMT.openInstallPermission(); } catch (e) {}
  }
};

/* ---------- requêtes HTTP via la coque native ----------
   La WebView ne peut pas appeler l'API Shopify directement (CORS) :
   la couche Java fait la requête et rappelle window.NMTcb. */

let cbSeq = 0;
const cbMap = {};

window.NMTcb = function (id, json) {
  const fn = cbMap[id];
  delete cbMap[id];
  if (!fn) return;
  let res;
  try { res = JSON.parse(json); } catch (e) { res = { ok: false, error: 'réponse illisible' }; }
  fn(res);
};

function nativeHttp(method, url, headers, body) {
  return new Promise((resolve, reject) => {
    if (!Native.ok()) { reject(new Error('coque native absente')); return; }
    const id = 'c' + (++cbSeq);
    cbMap[id] = resolve;
    setTimeout(() => {
      if (cbMap[id]) { delete cbMap[id]; reject(new Error('délai dépassé')); }
    }, 30000);
    try {
      window.NMT.httpAsync(method, url, JSON.stringify(headers || {}), body || '', id);
    } catch (e) {
      delete cbMap[id];
      reject(new Error(String(e)));
    }
  });
}

/* ---------- appels natifs avec rappel ---------- */

function nativeCall(fn, args) {
  return new Promise((resolve, reject) => {
    if (!Native.ok() || typeof window.NMT[fn] !== 'function') {
      reject(new Error('indisponible hors de l\'application'));
      return;
    }
    const id = 'c' + (++cbSeq);
    cbMap[id] = resolve;
    setTimeout(() => {
      if (cbMap[id]) { delete cbMap[id]; reject(new Error('délai dépassé')); }
    }, 60000);
    try {
      window.NMT[fn].apply(window.NMT, (args || []).concat([id]));
    } catch (e) {
      delete cbMap[id];
      reject(new Error(String(e)));
    }
  });
}

/* ---------- imprimantes du réseau local ---------- */

let PSTATES = {};

const Printers = {

  ok() {
    return Native.ok() && typeof window.NMT.printerStates === 'function';
  },

  /* relit le dernier état connu, tel que la relève l'a stocké */
  refresh() {
    if (!this.ok()) return PSTATES;
    try { PSTATES = JSON.parse(window.NMT.printerStates() || '{}'); }
    catch (e) { PSTATES = {}; }
    return PSTATES;
  },

  /* état d'une machine, ou null si injoignable ou jamais relevée */
  state(machineId) {
    const s = PSTATES[machineId];
    if (!s || !s.ok) return null;
    return s;
  },

  /* erreur de la dernière relève, pour l'afficher telle quelle */
  error(machineId) {
    const s = PSTATES[machineId];
    return (s && !s.ok) ? (s.error || 'injoignable') : '';
  },

  /* la configuration est dérivée des machines : une seule source de vérité */
  push() {
    if (!this.ok()) return;
    const conf = DB.machines
      .filter(m => m.printer && m.printer.kind && m.printer.host)
      .map(m => Object.assign({ machineId: m.id, name: m.name }, m.printer));
    try { window.NMT.savePrinters(JSON.stringify(conf)); } catch (e) {}
  },

  sync() {
    return nativeCall('syncPrinters', []).then(res => {
      PSTATES = res && typeof res === 'object' ? res : {};
      return PSTATES;
    });
  },

  probe(conf) {
    return nativeCall('probePrinter', [JSON.stringify(conf)]);
  },

  /* fraîcheur : au-delà de 40 min, l'info n'est plus fiable */
  fresh(machineId) {
    const s = PSTATES[machineId];
    return !!(s && s.at && Date.now() - s.at < 40 * 60000);
  }
};

const PRINTER_KINDS = [
  { v: 'bambu', label: 'Bambu Lab' },
  { v: 'moonraker', label: 'Creality / Klipper' }
];

function fmtRemaining(min) {
  if (min == null || min < 0) return '';
  if (min < 60) return min + ' min';
  const h = Math.floor(min / 60), m = min % 60;
  return h + ' h ' + String(m).padStart(2, '0');
}

/* ---------- helpers modèle ---------- */

function machineById(id) { return DB.machines.find(m => m.id === id) || null; }
function spoolById(id) { return DB.spools.find(s => s.id === id) || null; }
function profileById(id) { return DB.profiles.find(p => p.id === id) || null; }
function orderById(id) { return DB.orders.find(o => o.id === id) || null; }

function activeSpools() { return DB.spools.filter(s => !s.archived); }

/* Une entrée de stock = une référence de filament, pas une bobine physique :
   - sealed : le nombre de bobines encore sous vide
   - open   : ce qui reste, en grammes, sur celle qui est entamée
   C'est ce qui permet d'enregistrer « 10 kg de noir » d'un coup. */

function spoolTotal(s) {
  return Math.max(0, s.sealed || 0) * (s.spoolSize || 1000) + Math.max(0, s.open || 0);
}

function spoolCount(s) {
  return (s.sealed || 0) + ((s.open || 0) > 0 ? 1 : 0);
}

/* niveau de la bobine entamée : on raisonne en paliers, pas au gramme près */
function spoolLevel(s) {
  const size = s.spoolSize || 1000;
  const open = s.open || 0;
  const sealed = s.sealed || 0;

  if (spoolTotal(s) <= 0) return { key: 'empty', label: 'Vide', cls: 'bad', pct: 0 };
  if (open <= 0) return { key: 'sealed', label: 'Neuve', cls: 'ok', pct: 100 };

  const pct = (open / size) * 100;
  /* avec des bobines d'avance, une fin de bobine n'a rien d'alarmant */
  const soft = sealed > 0;
  if (pct < DB.settings.lowThreshold)
    return { key: 'low', label: 'Bientôt vide', cls: soft ? 'warn' : 'bad', pct };
  if (pct < 40) return { key: 'quarter', label: 'Faible', cls: soft ? 'ok' : 'warn', pct };
  if (pct < 75) return { key: 'half', label: 'Entamée', cls: 'ok', pct };
  return { key: 'full', label: 'Pleine', cls: 'ok', pct };
}

/* à racheter : plus de bobine d'avance et l'entamée touche à sa fin */
function needsRestock(s) {
  return (s.sealed || 0) === 0 &&
         (s.open || 0) < (s.spoolSize || 1000) * (DB.settings.lowThreshold / 100);
}

/* ouvre une bobine neuve si besoin, puis retire les grammes demandés.
   Renvoie ce qu'on n'a pas pu couvrir et le nombre de bobines ouvertes. */
function consumeSpool(s, grams) {
  const size = s.spoolSize || 1000;
  let left = grams, opened = 0;

  while (left > 0) {
    if ((s.open || 0) <= 0) {
      if ((s.sealed || 0) <= 0) break;
      s.sealed--;
      s.open = size;
      opened++;
    }
    const take = Math.min(s.open, left);
    s.open -= take;
    left -= take;
  }
  if (s.open < 0) s.open = 0;
  return { missing: left, opened: opened };
}

function spoolLabel(s) {
  if (!s) return 'Aucun filament';
  return [s.brand, s.material, s.color].filter(Boolean).join(' · ');
}

function colorHexOf(name) {
  const c = COLORS.find(c => c.n.toLowerCase() === String(name || '').toLowerCase());
  return c ? c.h : '#8a8f96';
}

/* stock disponible pour un couple matière + couleur (en g, approximatif) */
function stockFor(material, color) {
  return activeSpools()
    .filter(s => s.material === material && (!color || s.color === color))
    .reduce((t, s) => t + spoolTotal(s), 0);
}

/* clé de mémorisation des poids : produit + variante */
function weightKey(line) {
  return (line.title || '') + '||' + (line.variant || '');
}

function rememberedWeight(line) {
  const w = DB.weights[weightKey(line)];
  return typeof w === 'number' ? w : null;
}

function rememberWeight(line, grams) {
  if (grams > 0) { DB.weights[weightKey(line)] = grams; }
}

/* besoins matière d'une commande, regroupés par matière + couleur */
function orderNeeds(order) {
  const map = {};
  (order.lines || []).forEach(l => {
    if (l.done) return;
    const g = (l.grams || 0) * (l.qty || 1);
    if (!g) return;
    const k = (l.material || '?') + '|' + (l.color || '');
    if (!map[k]) map[k] = { material: l.material || '?', color: l.color || '', grams: 0 };
    map[k].grams += g;
  });
  return Object.values(map);
}

/* verdict stock d'une commande */
function orderStockVerdict(order) {
  const needs = orderNeeds(order);
  if (!needs.length) return { cls: '', label: 'Poids à saisir', short: 'Poids ?' };
  let worst = 'ok', missing = 0;
  needs.forEach(n => {
    const have = stockFor(n.material, n.color);
    if (have < n.grams) { worst = 'bad'; missing += n.grams - have; }
    else if (have < n.grams * 1.25 && worst !== 'bad') { worst = 'warn'; }
  });
  if (worst === 'bad') return { cls: 'bad', label: 'Manque ~' + fmtG(missing), short: 'Manque ' + fmtG(missing) };
  if (worst === 'warn') return { cls: 'warn', label: 'Stock juste', short: 'Juste' };
  return { cls: 'ok', label: 'Stock OK', short: 'OK' };
}

/* besoins de TOUTES les commandes à produire */
function globalNeeds() {
  const map = {};
  DB.orders.forEach(o => {
    if (o.status === 'done' || o.status === 'shipped') return;
    orderNeeds(o).forEach(n => {
      const k = n.material + '|' + n.color;
      if (!map[k]) map[k] = { material: n.material, color: n.color, grams: 0 };
      map[k].grams += n.grams;
    });
  });
  return Object.values(map).sort((a, b) => b.grams - a.grams);
}

/* ---------- formats ---------- */

function fmtG(g) {
  g = Math.round(g);
  if (g >= 1000) {
    const kg = g / 1000;
    return (kg >= 10 ? kg.toFixed(1) : kg.toFixed(2))
      .replace(/\.?0+$/, '')
      .replace('.', ',') + ' kg';
  }
  return g + ' g';
}

function fmtDur(ms) {
  if (ms < 0) ms = 0;
  const t = Math.floor(ms / 1000);
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  return m + ':' + String(s).padStart(2, '0');
}

function fmtDurShort(ms) {
  const t = Math.floor(ms / 60000);
  const h = Math.floor(t / 60), m = t % 60;
  if (h > 0) return h + ' h ' + (m ? String(m).padStart(2, '0') : '00');
  return m + ' min';
}

function fmtClock(ts) {
  const d = new Date(ts);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function fmtDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' });
}

function fmtDayClock(ts) {
  const d = new Date(ts), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const tomorrow = new Date(now.getTime() + 86400000).toDateString() === d.toDateString();
  if (sameDay) return fmtClock(ts);
  if (tomorrow) return 'demain ' + fmtClock(ts);
  return fmtDate(ts) + ' ' + fmtClock(ts);
}

/* détecte la matière dans un titre de variante Shopify
   ex. "Covert / Without Visor / PLA" · "DC-15s / PETG / Yes" */
function materialFromVariant(variantTitle) {
  const parts = String(variantTitle || '').split('/').map(p => p.trim());
  for (const p of parts) {
    const up = p.toUpperCase().replace(/\s+/g, '');
    const hit = MATERIALS.find(m => m !== 'Autre' && m.replace('-', '') === up.replace('-', ''));
    if (hit) return hit;
  }
  return '';
}

<script>
/* ============================================================
   ui.js — briques d'interface : feuilles, toasts, sélecteurs
   ============================================================ */

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

/* ---------- toast ---------- */

function toast(msg, kind) {
  const host = $('#toast-host');
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .25s';
    el.style.opacity = '0';
    setTimeout(() => el.remove(), 260);
  }, 2100);
}

/* ---------- feuille modale ---------- */

let sheetCloser = null;

function sheet(html, onMount) {
  closeSheet();
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = '<div class="sheet"><div class="sheet-grip"></div>' + html + '</div>';
  bg.addEventListener('click', e => { if (e.target === bg) closeSheet(); });
  $('#sheet-host').appendChild(bg);
  sheetCloser = () => bg.remove();
  if (onMount) onMount($('.sheet', bg));
  return bg;
}

function closeSheet() {
  if (sheetCloser) { sheetCloser(); sheetCloser = null; }
}

function confirmSheet(title, sub, okLabel, onOk, danger) {
  sheet(
    '<h2>' + esc(title) + '</h2>' +
    (sub ? '<div class="sub">' + esc(sub) + '</div>' : '<div class="sp"></div>') +
    '<div class="sheet-actions">' +
      '<button class="btn ghost" data-x="no">Annuler</button>' +
      '<button class="btn ' + (danger ? 'danger' : 'primary') + '" data-x="yes">' + esc(okLabel) + '</button>' +
    '</div>',
    root => {
      $('[data-x=no]', root).onclick = closeSheet;
      $('[data-x=yes]', root).onclick = () => { closeSheet(); onOk(); };
    }
  );
}

/* ---------- sélecteurs réutilisables ---------- */

function materialChips(name, current) {
  return '<div class="chips" data-chips="' + name + '">' +
    MATERIALS.map(m =>
      '<button type="button" class="chip' + (m === current ? ' on' : '') + '" data-v="' + esc(m) + '">' + esc(m) + '</button>'
    ).join('') + '</div>';
}

function colorChips(name, current) {
  return '<div class="chips" data-chips="' + name + '">' +
    COLORS.map(c =>
      '<button type="button" class="chip sw' + (c.n === current ? ' on' : '') + '" data-v="' + esc(c.n) + '" title="' + esc(c.n) + '">' +
      '<i style="background:' + c.h + '"></i></button>'
    ).join('') + '</div>' +
    '<div class="hint" data-colorname="' + name + '">' + esc(current || 'Aucune couleur choisie') + '</div>';
}

/* branche les groupes de chips d'une feuille : renvoie un getter de valeurs */
function bindChips(root) {
  const vals = {};
  $$('[data-chips]', root).forEach(group => {
    const key = group.getAttribute('data-chips');
    const on = $('.chip.on', group);
    vals[key] = on ? on.getAttribute('data-v') : '';
    group.addEventListener('click', e => {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      $$('.chip', group).forEach(c => c.classList.remove('on'));
      btn.classList.add('on');
      vals[key] = btn.getAttribute('data-v');
      const label = $('[data-colorname=' + key + ']', root);
      if (label) label.textContent = vals[key];
    });
  });
  return () => vals;
}

function selectOpts(items, current, labelFn, valFn, placeholder) {
  let out = placeholder ? '<option value="">' + esc(placeholder) + '</option>' : '';
  items.forEach(it => {
    const v = valFn(it);
    out += '<option value="' + esc(v) + '"' + (v === current ? ' selected' : '') + '>' + esc(labelFn(it)) + '</option>';
  });
  return out;
}

function spoolSelect(name, current, material) {
  let list = activeSpools().filter(s => spoolTotal(s) > 0);
  if (material) {
    const same = list.filter(s => s.material === material);
    if (same.length) list = same;
  }
  return '<select name="' + name + '">' +
    selectOpts(list, current, s => spoolLabel(s) + ' — ' + fmtG(spoolTotal(s)), s => s.id, 'Aucun') +
    '</select>';
}

/* ---------- blocs d'affichage ---------- */

function badge(cls, text) {
  return '<span class="badge ' + cls + '">' + esc(text) + '</span>';
}

function dot(hex, big) {
  return '<span class="dot' + (big ? ' lg' : '') + '" style="background:' + esc(hex || '#8a8f96') + '"></span>';
}

function emptyState(title, text, btnLabel, btnAction) {
  return '<div class="empty"><h3>' + esc(title) + '</h3><p>' + esc(text) + '</p>' +
    (btnLabel ? '<button class="btn primary" onclick="' + btnAction + '">' + esc(btnLabel) + '</button>' : '') +
    '</div>';
}

function gauge(pct, cls) {
  const w = Math.max(0, Math.min(100, pct));
  return '<div class="gauge"><i class="' + (cls === 'ok' ? '' : cls) + '" style="width:' + w + '%"></i></div>';
}

/* lit les champs nommés d'une feuille */
function formValues(root) {
  const o = {};
  $$('[name]', root).forEach(i => {
    o[i.getAttribute('name')] = i.type === 'checkbox' ? i.checked : i.value;
  });
  return o;
}

function num(v, def) {
  const n = parseFloat(String(v).replace(',', '.'));
  return isNaN(n) ? (def || 0) : n;
}
